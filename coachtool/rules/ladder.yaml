  u8: [B1, B2]
  u10: [B1, B2, B3]
  u12: [B1, B2, B3, B4]
  u14: [B1, B2, B3, B4, B5]
comp:
  u10: [B1, B2, B3]     # B4 does not start before U11
  u12: [B1, B2, B3, B4, B5]
  u14: [B1, B2, B3, B4, B5]
levels:
  rec: [intro]
  comp: [intro, dev, app]
