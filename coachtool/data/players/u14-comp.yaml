id: u14-comp
age: u14
who:
- label: Social
  text: These players are moving into a new social world, the kind of shift that comes with heading toward
    high school. They are building an identity, which can create friction with authority, including you.
    They lean on a peer group or a best friend. Pushing back is part of how they grow up, not a sign they
    stopped caring. Treat it as defiance and you lose them. Give them some ownership of decisions and
    you keep them.
- label: Emotional
  text: Players are sensitive about their bodies and compare themselves to teammates who are maturing
    faster or slower. Mood swings are sharper than at U12 and impulse control is still catching up. The
    blowup after a bad touch or a tough loss is not an attitude problem. It is a player who has not built
    the regulation skills to match the emotion. Mistakes and losses carry more weight socially than they
    did at U12.
- label: Cognitive
  text: 'This is the inflection point. These players can reason beyond what they are told, take responsibility
    for their own commitment and plan ahead. They can start to build an identity around a role: not just
    a soccer player, but the center back or the wing back. That is what makes deeper positional work possible
    at U13. They can now understand why a responsibility exists and start to own it.'
- label: Physical
  text: 'Growth is visible and uneven. Injury rates rise: ankle sprains, tendonitis, and growth-related
    issues like Osgood-Schlatter and Sever''s. The gap between your earliest and latest maturing players
    is wider than last year and keeps widening through U14. Do not let physical maturity stand in for
    development. Flex effort and fitness expectations to the player, and watch training load.'
- label: What US Soccer asks
  text: 'Progression Phase I is the first stage where players play inside a formation with defined roles.
    New objectives appear: midfield interchange, center back penetration into midfield to create overloads,
    and quick combination play under high pressure in tight spaces. Coaches are asked to help players
    own their development, encourage player-led warm-ups and player-to-player coaching, and have players
    solve game situations themselves.'
great_session:
- title: Players take the shot
  text: The ball is in the final third and someone shoots, early, with composure, without a second dribble.
    Missing is fine. Not shooting is the problem.
- title: Compact, connected shape
  text: 'Eleven players on a big field can look scattered. Look for lines that stay close enough to support
    each other: defenders, midfielders and forwards moving as one unit.'
- title: Instant reaction on turnovers
  text: When the ball changes hands, do players react in the first second or watch? That reaction is the
    whole game-moments block.
- title: Players talking to each other
  text: 'Voices on the field: "Man on," "Turn," "Switch." Player-to-player coaching is a development goal.
    Step back when it happens.'
- title: Practice A concept in Practice B
  text: If something from the first session of the week shows up in the second without you asking, the
    concept is taking hold.
- title: Everyone gets a turn in goal
  text: Rotate the goalkeeper. Finishing practice is also goalkeeper practice, so nobody should miss out
    on a turn.
prepared: Before you arrive, read the week's theme and the block and level for each practice. Build each
  practice from the library or your own activities. With two practices a week, Practice A introduces and
  Practice B deepens. Both are correct. Try not to pair two new concepts in the same practice. If the
  group needs more time on a concept, stay with it instead of moving on.
parents:
  intro: 'Before the session starts, take 30 seconds to walk over. Something like:'
  script: 'This season we are working on finishing and on the moment the ball changes hands. The most
    helpful thing you can do is cheer the brave decisions: the player who shoots, the player who sprints
    back, the player who tries the pass that might not work.'
  outro: At U14 players hear everything. Positive sideline energy is genuinely useful. Criticism of a
    missed shot makes the next shot less likely.
cues:
- when: Player shoots early and misses
  say: '"Good decision. Great shot to take. Take that one every time." Praise the decision before you
    talk about the technique.'
- when: Player passes up a clear shot
  say: 'Ask, do not tell: "What were you thinking when you had that space?" Then listen. Often it is confidence,
    not judgment.'
- when: Team defends compactly
  say: '"That shape right there, everyone close enough to support each other. That is exactly what we
    are building toward."'
- when: Player presses instantly after turnover
  say: 'Name it in the moment: "Did everyone see that? No hesitation. That is the whole idea."'
- when: Players coaching each other
  say: 'Step further back. Let it run. Come back and ask: "What did you tell your teammate there?"'
- when: Players too self-critical
  say: '"The best players in the world miss shots and lose the ball in every game. The difference is what
    they do next."'
