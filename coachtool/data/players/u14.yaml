id: u14
age: u14
who:
- label: Growth is uneven
  text: In any U14 group you will see players who have already grown a lot and players who have not started.
    Do not read size as skill. Praise decisions and effort, and watch that your biggest players are not
    only winning duels with size.
- label: The field got big
  text: The jump from 9v9 to 11v11 is a jump in distance, not just numbers. Players tire faster and shape
    breaks down. Short rests and water breaks are coaching tools, not weaknesses.
- label: Peers matter more than you
  text: At this age what teammates think carries a lot of weight. Individual feedback works best quietly,
    one on one. Public praise for team moments and brave decisions builds the culture you want.
- label: Some will be ready for more
  text: A few players in your group may be curious about a more competitive pathway. Notice them, encourage
    them, and pass it on to your club. Do not promise anything. Just open the door.
great_session:
- title: Players take the shot
  text: The ball is in the final third and someone shoots, early, with composure, without a second dribble.
    Missing is fine. Not shooting is the problem.
- title: Compact, connected shape
  text: 'Eleven players on a big field can look scattered. Look for lines that stay close enough to support
    each other: defenders, midfielders and forwards moving as one unit.'
- title: Instant reaction on turnovers
  text: When the ball changes hands, do players react in the first second or watch? That reaction is the
    whole game-moments block.
- title: Players talking to each other
  text: 'Voices on the field: "Man on," "Turn," "Switch." Player-to-player coaching is a development goal.
    Step back when it happens.'
- title: Practice A concept in Practice B
  text: If something from the first session of the week shows up in the second without you asking, the
    concept is taking hold.
- title: Everyone gets a turn in goal
  text: Rotate the goalkeeper. Finishing practice is also goalkeeper practice, so nobody should miss out
    on a turn.
prepared: Preparation at U14 is simpler than at U12, because the group already knows the language. Pick
  the week's focus before you arrive and choose Activity A as something familiar. Activity B is where
  the new idea lives. If the group needs more time on a concept, run the revisit instead of moving on.
  With two practices a week, Practice A introduces and Practice B deepens. Both are correct. Try to avoid
  pairing two new concepts in the same session.
parents:
  intro: 'Before the session starts, take 30 seconds to walk over. Something like:'
  script: 'This season we are working on finishing and on the moment the ball changes hands. The most
    helpful thing you can do is cheer the brave decisions: the player who shoots, the player who sprints
    back, the player who tries the pass that might not work.'
  outro: At U14 players hear everything. Positive sideline energy is genuinely useful. Criticism of a
    missed shot makes the next shot less likely.
shape:
  title: The session
  why: 'Kids join a team to play. So every session opens with play and closes with play, and practice sits in the middle. The opening play is a small game with one added rule that sets a challenge, so the players solve the problem you are working on without being told how. Your job is to build the challenge into the play, not to take the play away.'
  note: Up to 90 minutes. Arrive 15 minutes early. Play, Activity A, Activity B, play.
  opening:
    label: Play
    minutes: 12 min
    title: 6v6 or 7v7 free small-sided game
    setup: Same setup every session. Smaller than the closing game, so more touches, more shots and cleaner
      decisions. Half a field, with a full-size or large goal at each end. Teams of 6 or 7. Add a goalkeeper
      if you have one willing. Quick restarts. Let them play the first 8 minutes without saying anything.
      On Practice B days, watch for whether the concept from Practice A earlier in the week shows up.
    job: Watch the moments in front of goal. Do players shoot? Do they pick their moment or force it?
      Watch the transitions too. Come in with Activity A already chosen and let the opening play confirm
      your read for Activity B.
    question: When you had a chance to shoot today, what made you take it or pass it up?
    kit: 1 ball per team · Full-size or large goals · Disc cones · Pinnies in 2 colors
  closing:
    label: Play
    minutes: 25 min
    title: Full game
    setup: 'The biggest game of the session. Full field, full-size goals, goalkeepers. Play 11v11 if you
      have the numbers. Short of players? Play 9v9 or 10v10 on a narrower field rather than leaving gaps.
      Alternatively, put a full-size goal with a keeper at one end and two small goals at the halfway
      line for the other team to attack. Offside applies, so introduce it early in the season and be patient
      with it. Let the game run without stopping. Watch for the focus you introduced that week showing
      up without being asked: a team that stays compact across three lines, a player who sprints to press
      the instant possession is lost, a forward who shoots when the chance comes.'
    question: Was there a moment today where your whole team did something together, attacking or defending,
      that one player could not have done alone?
    kit: Full field · Full-size goals · Disc cones · Pinnies in 2 colors
cues:
- when: Player shoots early and misses
  say: '"Good decision. Great shot to take. Take that one every time." Praise the decision before you
    talk about the technique.'
- when: Player passes up a clear shot
  say: 'Ask, do not tell: "What were you thinking when you had that space?" Then listen. Often it is confidence,
    not judgment.'
- when: Team defends compactly
  say: '"That shape right there, everyone close enough to support each other. That is exactly what we
    are building toward."'
- when: Player presses instantly after turnover
  say: 'Name it in the moment: "Did everyone see that? No hesitation. That is the whole idea."'
- when: Players coaching each other
  say: 'Step further back. Let it run. Come back and ask: "What did you tell your teammate there?"'
- when: Players too self-critical
  say: '"The best players in the world miss shots and lose the ball in every game. The difference is what
    they do next."'
