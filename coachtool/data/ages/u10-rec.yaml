pills_note: >-
  Two perceptual skills get significantly more emphasis this year. **Supporting** now means finding open space AND moving after giving a pass: repositioning after the pass is the give-and-go in its simplest form.
  **Body Shape** means shoulders and hips at 45–90 degrees toward the attacking goal when receiving, so the player can already see the field when the ball arrives.
  These two actions together are the foundation of combination play. Defending joins the plan this year too. **Covering** means standing behind the pressing teammate at a distance that lets you step in if they are beaten.
  **Marking** means staying close to an opponent and between that player and the goal. Together they are how a group of kids starts to defend as a team.
