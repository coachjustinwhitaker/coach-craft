id: u6-rec
age: u6
track: rec
sessions_per_week: 1
backup_slot: b
slot_labels:
  a: Main activity
  b: Backup, if they lose interest
weeks:
- week: 1
  focus: Moving with the ball
  lead: "Get the ball moving with the player and stopping on command."
  say: "Ball close! Stop when I say red."
  watch:
    title: "Ball close, real stops"
    text: "Do they stop with a foot on the ball at red? Do they keep the ball close at yellow?"
  sessions:
  - a:
      activity: red-light-green-light
      note: Ball close at yellow, a real stop at red
    b:
      activity: 101-dalmatians
      note: Same grid and balls. Switch here if they need goals to chase
  block: D
  level: intro
  also_blocks:
  - B1
- week: 2
  focus: Dodging and changing direction
  lead: "Teach players to change direction with the ball."
  say: "Dodge the shark! Find the open gap."
  watch:
    title: "Changing direction"
    text: "Do they change direction when someone gets close? Are they looking up to find open space?"
  sessions:
  - a:
      activity: sharks-and-minnows
      note: Heads up to find the gaps
    b:
      activity: octopus
      note: Same ocean, a new monster to dodge
  block: D
  level: intro
  also_blocks:
  - B1
- week: 3
  focus: Counting, scoring and heads up
  lead: "Counting and scoring get players looking up to find their next target."
  say: "Count your goals out loud! Can we reach 101 together?"
  watch:
    title: "Scores and heads up"
    text: "Are they shouting their scores? Do they look up to find an open target before they dribble in?"
  sessions:
  - a:
      activity: 101-dalmatians
      note: Count together and raise the target each round
    b:
      activity: wreck-it-ralph
      note: Same grid and balls. Switch here to score through goals instead of counting
  block: D
  level: intro
  also_blocks:
  - B1
- week: 4
  focus: Turns and escaping
  lead: "Teach players to move their bodies to turn the ball around cones and away from a chaser."
  say: "Turn away when the dinosaur gets close!"
  watch:
    title: "Turning their bodies"
    text: "Do they turn their body with the ball instead of running past it? Notice who uses both feet, but do not coach it."
  sessions:
  - a:
      activity: dinosaur-tag
      note: Watch for both feet on the turns
    b:
      activity: kangaroo-jacks
      note: "Same idea, turning away from a chaser. A bigger group game"
  block: D
  level: intro
  also_blocks:
  - B1
- week: 5
  focus: Finding the goal
  lead: "Dribbling has a point: find a goal and score."
  say: "Find a goal and score! Celebrate every one."
  watch:
    title: "Looking for the goal"
    text: "Do they look for a goal before they dribble toward it? Are they celebrating?"
  sessions:
  - a:
      activity: wreck-it-ralph
      note: Celebrate every goal loudly
    b:
      activity: 101-dalmatians
      note: Familiar and loud. Count the goals together
  block: D
  level: intro
  also_blocks:
  - B1
- week: 6
  focus: Silly games, real skills
  lead: "Keep it silly while players learn to keep the ball close before they strike it."
  say: "Be a silly mosquito! Keep the ball close before you strike."
  watch:
    title: "Close before they strike"
    text: "Is the ball close before they kick it? Are they laughing while they work?"
  sessions:
  - a:
      activity: mosquitoes
      note: Dribble close before striking. Keep the grid small
    b:
      activity: octopus
      note: Same ocean, different monster
  block: D
  level: intro
  also_blocks:
  - B1
- week: 7
  focus: Favorites
  lead: "Revisit the games they love, so players can feel how much they have improved."
  say: "Can we beat our group total from last time?"
  watch:
    title: "Remembering favorites"
    text: "Do they remember the rules without help? Which game do they ask for again?"
  sessions:
  - a:
      activity: 101-dalmatians
      note: 'Revisit: beat last time''s group total'
    b:
      activity: red-light-green-light
      note: An easy reset if the energy drops
  block: D
  level: intro
  also_blocks:
  - B1
- week: 8
  focus: Coach's choice
  coach_choice: true
  note: Run what your group loves most. If they are begging for more, you picked right.
