season_note: The weekly themes are a suggested order, so the season builds skill step by step instead
  of chasing whatever last weekend showed. Use them as the frame. If a game exposes a real problem, work
  it into your practice and keep the theme.
id: u14-comp
age: u14
track: comp
sessions_per_week: 2
phases:
- name: Preseason
  weeks:
  - 1
  - 6
  goal: Set the baseline
  text: 'No Application-level work yet. Players install the habits and technique every later block depends
    on: individual technique, combination play and collective defending shape.'
  success: Players are comfortable receiving under light pressure, understand basic team mechanics and
    defensive shape, and show early decision-making instead of hesitation.
- name: In-Season
  weeks:
  - 7
  - 12
  goal: Apply under real pressure
  text: Games provide the pressure Application needs. B4 and B5 come online, and B1 to B3 start Application
    reps against real defenders.
  success: Decisions hold up at game speed, transitions trigger without prompting, and finishing chances
    start to convert more consistently.
- name: Peak Performance
  weeks:
  - 13
  - 18
  goal: Perform at the highest level
  text: Every block cycles at Application through repeated performance, not new content. Composure and
    game management are built through reps, not lectures.
  success: Composure in finishing moments, informed choices late in games, and communication and ownership
    without prompting.
standing:
- title: 'Every week: one live set-piece rep'
  text: 'Attacking or defending: a corner, a free kick or a throw-in. It is a background layer, not a
    themed week.'
