why_periodize:
- title: Plan, do not react
  text: 'Periodization ties every week to a developmental standard: what players need to be building at
    this point in their growth, in the order that lets those habits compound. It is a plan built against
    a framework, and it holds regardless of how last Saturday went.'
- title: The alternative treats symptoms
  text: After a tough loss it is tempting to chase the scoreline. Conceded on transitions, so Tuesday
    becomes a transition drill. Missed chances, so Wednesday is finishing. It feels responsive, but it
    treats symptoms instead of building players, and nothing compounds. A periodized plan stays with the
    standard. Trust the sequence, and problems like transitions and finishing tend to solve themselves,
    because the foundation underneath them is solid.
- title: The season is a spiral
  text: Blocks do not run once and finish. A concept is introduced, the team moves to other work, then
    returns to it at a deeper level, with real spacing so each return is a genuine retention check. Introduction
    becomes Development. Development becomes Application. At U13, Application is also where specialization
    begins, grouped by who executes the action together rather than assigned upfront.
- title: Weekly themes are a lens
  text: 'Every week carries a theme, something a player can hold onto: a focus idea you can build a practice
    around or talk about before or after training. The themes are not a second curriculum. They are a
    lens on the same week''s work, connecting the technical content to something bigger like tempo, composure,
    decision-making and ownership.'
- title: Why this protects your players
  text: 'A coach who reacts to every result sends a message: what we work on depends on whether we won
    last week. Players feel that instability and start playing not to make mistakes. A periodized plan
    says we know where we are going and this week connects to last week''s and next week''s. Players build
    confidence in the process, not just their skills.'
- title: What it asks of you
  text: Hold the line when the instinct to fix things is strong. After a hard game you will want to throw
    the plan out. Sometimes that is the right call. But the default should be the plan, because it was
    built when you were thinking clearly, not in the 24 hours after a loss.
levels:
- title: Introduction
  text: Players are becoming aware of a concept and trying it. Decisions are slow and execution is inconsistent.
    Every player at every position works through this level the same way.
- title: Development
  text: Players make repeatable, intentional choices. They understand the concept and are beginning to
    apply it under pressure, but it is not yet automatic. Still universal, with no position differentiation.
- title: Application
  text: Decisions are fast and reliable under real game pressure. This is where position-specific depth
    begins to show up, grouped by who actually executes the action together, not by fixed labels.
- title: Your goal
  text: Not to push every player to Application by the end of the season. Recognize where each player
    is and create the right conditions for them to move forward from there. Arriving at Introduction and
    leaving at Development is progress. Reaching Application under pressure by the final weeks is a great
    season.
- title: Specialization at U13
  text: Introduction and Development stay universal in every block. Application is where specialization
    begins, grouped by function rather than assigned upfront. A player's technique and decision-making
    at Application are still revealing what kind of player he is becoming. Locking a player into a position
    too early risks missing who he actually turns out to be.
