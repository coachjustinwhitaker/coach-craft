equipment: Balls · Cones · Full-size goal and keeper · Corner flag or marker cone
setup: Walk-through with no opposition. A short-corner taker, three decoys, a target and a blocker.
rules:
- Three decoys sprint together toward the far post to drag their markers and create traffic.
- The target loops around the outside of that traffic to arrive free at the near post. A blocker steps
  across the target's marker to seal them off.
- The ball is played short, then along the ground for a first-time finish.
coach_note: Target runners want good spatial timing more than pure speed.
coach:
- cue: Let the traffic build before you loop. Arrive last, arrive free.
  ask: What had to happen before you looped?
- cue: 'Blocker: step across the marker without moving the target.'
  ask: Where did you stand to block, and did the target get free?
