id: duels-to-goal
order: 44
name: Duels to Goal
block: B5
type: small-sided
objective: Attacker and defender race to a played ball and finish the 1v1 on goal. Commit and decide quickly.
skills:
- Shooting
- Decision-Making
ages:
- u14
tracks:
- rec
levels:
- intro
players:
  min: 6
  max: 20
space: half
minutes: 15
setup: 'Two lines of players about 25 yards from a full-size goal with a goalkeeper (rotate keepers often).
  The coach plays a ball in. The first attacker and first defender race to it and play 1v1 to goal. Shot,
  save, miss or ball out ends the duel. Next pair goes. Keep the pace quick: three or four duels per player,
  then swap roles.'
coach:
- cue: 'The moment of decision: does the attacker commit, or hesitate and give the defender time? Look
    for the attacker who takes one decisive touch toward goal, and for the player who shoots early instead
    of dribbling one extra time. For defenders, look for patience: delay, do not dive in.'
  ask: 'When you had the ball facing the goalkeeper, what did you decide first: shoot, dribble, or pass?
    What told you that?'
pairs_with:
- flying-numbers
- waves
equipment: Balls in a bag · 1 full-size goal · Disc cones · Pinnies
