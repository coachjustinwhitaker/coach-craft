id: hawaii
order: 35
name: Hawaii
block: B4
type: small-sided
objective: Continuous play with a goal on each end line. Switch from attack to defense the instant it
  changes hands.
skills:
- Decision-Making
- Pressing
ages:
- u12
tracks:
- rec
levels:
- intro
players:
  min: 6
  max: 16
space: half
minutes: 15
setup: Square grid. Two goals set back about 5 yards from each end, one per team. 3v3 or 4v4. Players
  can score on either goal on their end line but must shoot from inside the grid. Keep extra balls next
  to you and feed them in immediately after each score or out-of-bounds. Continuous play, no stoppages.
coach:
- cue: The continuous play means players are constantly switching between attack and defense. Watch for
    who reacts instantly versus who celebrates and switches off. Relentless transitions make this the
    most game-realistic activity in this group.
  ask: When a new ball came in while you were still celebrating a goal, how quickly did you switch back
    to defending?
pairs_with:
- flying-numbers-transition
- crisscross
equipment: Multiple balls (keep several nearby) · 4 goals in 2 pairs · Disc cones · Pinnies
