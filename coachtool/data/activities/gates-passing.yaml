id: gates-passing
order: 5
name: Gates Passing
block: B2
type: pattern
objective: Pairs pass through gates, then move to a new one. Pass and move together.
skills:
- Passing
- Supporting
- Communication
ages:
- u10
tracks:
- rec
levels:
- intro
players:
  min: 2
  max: 16
space: half
minutes: 15
setup: Rectangular grid with 8–10 gates scattered throughout (two cones arm’s length apart). Players in
  pairs with one ball. Score by passing to each other through gates. After passing, move immediately to
  a new gate. Encourage players to tell their partner where they are going before they pass.
coach:
- cue: 'The pass-and-move habit is the entire point. A player who passes and stands still is not learning
    “Me & My Teammates.” Look for any player who moves after passing. Name it when you see it. Also look
    for open body shape on receiving. Progress: replace the gates with cone triangles scattered around
    the grid. Players score by passing through a triangle to their partner. Now add a challenge: tell
    your partner where you are going before you pass. The pair that communicates most will score the most.'
  ask: After you passed the ball, what did you do next? Why does moving matter?
pairs_with:
- flying-numbers
- rondo
equipment: 1 ball per pair · 8–10 tall cone gates · Disc cones for grid
variants:
- id: triangle-goal-game
  name: Triangle Goal Game
  note: 'Progression: replace the gates with cone triangles. Players score by passing through a triangle
    to their partner.'
