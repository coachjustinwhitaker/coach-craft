equipment: Balls · Cones · Full-size goal and keeper · Corner flag or marker cone
setup:
- Walk-through with no opposition. A corner taker, a target runner and three decoys.
- The target starts closest to the ball among the runners. The three decoys cluster between the target
  and the back post.
rules:
- As the taker steps to strike, the target spins away from the ball and loops around the outside of the
  cluster to arrive free at the back post.
- The decoys peel off toward the near post and the center of goal.
coach_note: 'Assign roles by who you have. The target wants good spatial timing more than pure speed.
  Defending is secondary today: full man-marking, every attacker has a defender assigned before the serve,
  called out loud, with the keeper organizing.'
coach:
- cue: Go last, arrive first. Let your teammates clear the path before you spin.
  ask: When did you spin, and what had cleared?
- cue: 'Defenders: know your mark before the serve.'
  ask: Who was your mark?
