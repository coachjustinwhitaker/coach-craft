id: duck-tails
order: 20
name: Duck Tails
block: B1
type: ball-mastery
objective: Dribble and protect the ball while stealing a teammate's tail. Shield with your body and face
  the pressure.
skills:
- Dribbling
- Protecting
ages:
- u8
tracks:
- rec
levels:
- intro
players:
  min: 4
  max: 16
space: quarter
minutes: 20
setup: 'Grid about 20 by 20 yards. Every player has a ball and tucks a pinny in the back of their shorts.
  Players dribble around the space trying to steal a teammate''s tail while protecting their own. Start
  with no elimination: if a tail falls off, tuck it back in and keep playing. Count how many tails each
  player collects.'
coach:
- cue: Players who face their opponent rather than just running away. That is the beginning of how they
    will take on a defender. Heads up to see where tails are and where opponents are coming from.
  ask: What did you do when someone came to steal your tail?
pairs_with:
- knockout
- dinosaur-tag
equipment: 1 ball per player · Disc cones for grid · Pinnies as tails
progression:
- title: Elimination round
  text: Switch to elimination for a final competitive round. A stolen tail means you are out. The last
    player with their tail wins.
