equipment: Balls · Cones · Full-size goal and keeper · 2 small goals · Pinnies in 2 colors
setup:
- Same grid as 3v2 Line-Break and Wide Finish. No need to move the goal or cones.
- 6 serves the rondo in from outside the grid, then anchors the back of the shape. 8 and 10 sit central,
  9 up top near the edge of the box, 7 and 11 wide in the lanes as outlets. 4 and 5 press inside the shape
  to win the ball back.
- Rotate 4 and 5 out for two resting attackers every few minutes. After a goal, a save or a clean win
  by the defenders, 6 serves a new ball.
rules:
- The group combines at least 5 passes before breaking to goal.
- 'Then release: a ball to either winger to run it and shoot or cross, or a line-break to 9, who turns
  and finishes.'
- The defender nearest the release sprints to recover and contest it.
coach:
- cue: Do not force the release early. String the passes together until the picture is open.
  ask: What opened up that told you to release?
- cue: 'Winger on the release: beat your recovering defender before you decide to cut in or cross.'
  ask: What did you see when you received?
- cue: '9 on a central release: get your body shape ready before the ball arrives.'
  ask: Where was the defender when you set your body?
- cue: 'Caught upfield after a turnover: sprint back into the shape, do not jog.'
  ask: What did you do the moment you lost it?
