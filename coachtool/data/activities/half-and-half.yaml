id: half-and-half
order: 28
name: Half and Half
block: B2
type: small-sided
objective: A goal only counts if a player is in each half. Teams learn to use the length of the field
  and keep a player back.
skills:
- Supporting
- Combination Play
ages:
- u12
tracks:
- rec
levels:
- intro
players:
  min: 6
  max: 16
space: half
minutes: 15
setup: Rectangular grid with goals at each end and a midpoint line of cones. 3v3 or 4v4. Normal scrimmage,
  except a goal only counts if the attacking team has at least one player in both their attacking AND
  defending halves when the goal is scored. The player who stays back is providing depth and defensive
  security.
coach:
- cue: Forces players to spread across the length of the field, not just the width. The player who stays
    in the defending half might miss the goal celebration. Acknowledge them specifically. US Soccer introduces
    depth of shape explicitly at U12. This game teaches it without you naming it.
  ask: 'The player who stayed back when your team scored: what were they protecting?'
pairs_with:
- flying-numbers
- barcelona
equipment: 1 ball · 2 small goals · Disc cones including midpoint line · Pinnies
