id: kangaroo-jacks
order: 40
name: Kangaroo Jacks
block: D
type: ball-mastery
objective: Dribble across the grid without being tagged by hopping Kangaroo Jacks. Tagged players become
  Kangaroos too.
skills:
- Dribbling
- Controlling
ages:
- u6
tracks:
- rec
levels:
- intro
players:
  min: 4
  max: 14
space: quarter
minutes: 10
setup: Rectangle about 20 by 15 yards. One or two volunteers are the Kangaroo Jacks. Everyone else has
  a ball. Kangaroo Jacks must hop everywhere they go. Players dribble from one side of the grid to the
  other without getting tagged by a hopping Kangaroo Jack. If tagged, that player becomes a Kangaroo too.
  After a minute or so, call time, catch your breath, and play again.
coach:
- cue: The hopping is the whole point. Two-footed hopping is genuinely difficult for many 5 and 6 year
    olds and they will fall over and think it is hilarious. That is fine. Let them. The coordination work
    happening in this game is foundational to athletic development and they will never know they are training.
  ask: When more kangaroos appeared, how did you find space to dribble?
pairs_with:
- bunny-trail
- snake
equipment: 1 ball per player (except kangaroos) · Disc cones for rectangle
