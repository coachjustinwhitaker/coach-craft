age: u6
blocks:
  D:
    tagline: Move with the ball. Heads up. Have fun.
    overview: There are no player action frameworks, no tactical concepts and no positional requirements
      at this age. Just three things, said plainly, that you can come back to in any game at any moment.
      Fun is the most important one, and the one coaches forget most often.
    problem: 'Players fall in love with the game: moving with the ball, looking up, and wanting to come
      back next week.'
    focus:
    - 'Move with the ball: keep it close, use your feet, take it with you'
    - 'Heads up: see what is around you, find space, see your teammates'
    - Have fun
