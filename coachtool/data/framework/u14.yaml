age: u14
blocks:
  B1:
    tagline: Prepare the body. Read the picture. Execute with intent.
    overview: 'Every player''s relationship with the ball comes before everything else. This block establishes
      the perceptual and technical habits that make all combination play, defending and finishing possible:
      scanning before the ball arrives, shaping the body to play forward, and using first touch to create
      a decision rather than just react to pressure. When a player stalls in a later block, look back
      here first.'
    problem: Players scan, position and make first-touch decisions under high pressure in tight spaces.
    focus:
    - Scanning before, during and after receiving
    - Body shape and movement to play forward
    - Using first touch to create a decision, not just control
    - Technique at full game speed and pressure
  B2:
    tagline: Create advantage. Move the ball forward. Solve pressure together.
    overview: 'Combination play only works if the individual technique from the first block is already
      in place. This block takes that foundation and asks players to solve pressure together: recognizing
      a teammate''s run, providing the right angle of support, and timing the next action so the advantage
      compounds rather than stalls.'
    problem: Players use teammates to create time, space and numerical advantages, moving the ball forward
      under pressure through deliberate combination play.
    focus:
    - Supporting angle, distance and timing
    - Combination play to break defensive lines
    - Recognizing and exploiting overloads
    - Movement after the pass, not just the pass itself
  B3:
    tagline: Compact. Coordinated. Aggressive. Defending is not just for defenders.
    overview: 'Defending is not just for defenders. Winning the ball back is a collective action: the
      nearest player pressures, teammates cover behind, and the team stays connected and compact to protect
      dangerous space. The standard is no longer just reacting to losing the ball. Teams defend proactively,
      with a compact block that regains possession as high up the field as possible.'
    problem: Players create and maintain a compact defensive block, applying coordinated pressure, cover
      and balance to prevent forward play and regain the ball.
    focus:
    - Coordinated pressure, cover and balance
    - Compact shape, vertically and horizontally
    - High defensive line and line management
    - Immediate reaction after losing the ball
  B4:
    tagline: Recognizing moments and acting fast.
    overview: 'Transitions are the moments that decide games. This block links attacking and defending:
      the instant possession changes, players must recognize the moment and respond, either with maximum
      intensity to win the ball back, or with immediate speed to attack before the opponent can organize.
      A player who reacts fast in transition is applying technique, combination and defensive shape all
      at once.'
    problem: 'Players recognize the moment possession changes and respond immediately: pressing or recovering
      when it is lost, and playing forward at speed or securing the ball when it is won.'
    focus:
    - Immediate recognition of the transition moment
    - Reaction speed and acceleration
    - Press or recover, play forward or secure
    - Communication and organization under chaos
  B5:
    tagline: Can we turn advantage into goals?
    overview: All of the work in the earlier blocks is preparation for this one. Players who scan early,
      combine well, defend collectively and transition fast create finishing opportunities. This block
      is about having the composure and technique to take them. When players struggle to finish, the answer
      is rarely more finishing drills. Check the quality of preparation touches, the timing of runs, and
      the decisions made before the shot.
    problem: 'Players convert advantage into goals under pressure: separating to receive, combining for
      the final pass, and finishing with composure and limited touches.'
    focus:
    - Converting advantage into goals through quality final actions
    - Separating and unmarking to receive in the box
    - Finishing with composure and limited touches
    - Managing tempo and stakes as the game state demands
