age: u12
rules:
- label: Format
  text: 9v9
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Ball
  text: Size 4
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Field
  text: 70 to 80 yards long, 45 to 55 yards wide
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Goals
  text: Up to 7 feet high, 21 feet wide
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Game time
  text: 2 halves of 30 minutes
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Goalkeeper
  text: Goalkeeper
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Offside
  text: Offside applies
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Heading
  tracks:
  - rec
  text: Not allowed in practice or games, for the whole age group. Rec groups mix two birth years, so
    one rule has to cover every player. Recreational players start heading at U14.
  source: 'Methodology default: rec players start heading at U14, comp players at U12'
- label: Heading
  text: Heading starts at U12 in competitive play. US Soccer limits it in practice to 30 minutes a week
    and 15 to 20 headers per player a week. Check your league for game rules.
  source: US Soccer Player Development Initiatives; US Soccer U11-U12 age group guide
  tracks:
  - comp
- label: Substitutions
  text: Unlimited, at any stoppage
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Rosters
  text: Up to 16 players. A team needs at least 6 to start or continue.
  source: US Soccer Player Development Initiatives, small-sided games chart
- label: Head injuries
  text: If a head injury is suspected, play stops for evaluation. The player may be substituted. Return
    requires clearance from a health care professional or certified athletic trainer.
  source: US Soccer Player Development Initiatives, small-sided games chart
