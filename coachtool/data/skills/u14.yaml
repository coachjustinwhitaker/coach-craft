skills:
- id: u14-b1-perception-preparation-intro
  age: u14
  block: B1
  area: Perception & Preparation
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Scan before receiving to identify pressure and options
  - Begin orienting the body to see the field before the ball arrives
  - Recognize the obvious difference between time and immediate pressure
- id: u14-b1-controlling-intro
  age: u14
  block: B1
  area: Controlling
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Treat first touch as a decision, not just control
  - Receive across the body to begin opening up the field
  - Use small, controlled touches to set up the next action
- id: u14-b1-protecting-intro
  age: u14
  block: B1
  area: Protecting
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Shield and protect the ball when no forward option exists
  - Use the body between the ball and the defender
  - Hold possession until a forward option opens
- id: u14-b1-driving-intro
  age: u14
  block: B1
  area: Driving
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Attack the ball under pressure, move toward it rather than waiting
  - Push into open space when it is available
  - Begin to play with the head up while moving with the ball
- id: u14-b1-dribbling-intro
  age: u14
  block: B1
  area: Dribbling
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Use a first action, touch or feint, to create space
  - Begin recognizing obvious 1v1 moments
  - Show basic coordination when changing direction with the ball
- id: u14-b1-passing-intro
  age: u14
  block: B1
  area: Passing
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Play forward when possible, support when not
  - Use one touch when the pass dictates it
  - Begin passing accurately with both feet under light pressure
- id: u14-b1-decision-making-intro
  age: u14
  block: B1
  area: Decision-Making
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Base the decision on body shape and scan before contact
  - Recognize forced one-touch situations versus time to take a touch
  - Decisions are deliberate and often reactive at this level
- id: u14-b2-perception-preparation-intro
  age: u14
  block: B2
  area: Perception & Preparation
  level: intro
  tracks:
  - rec
  bullets:
  - Scan beyond the ball to identify nearby teammates
  - 'Recognize simple support positions: behind, beside and ahead of the ball'
  - Identify when a teammate is under pressure and needs an outlet
- id: u14-b2-supporting-intro
  age: u14
  block: B2
  area: Supporting
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Offer a clear passing option when a teammate has the ball
  - Move to avoid standing directly behind a defender
  - Reposition after passing rather than watching what happens next
- id: u14-b2-technique-for-combination-play-intro
  age: u14
  block: B2
  area: Technique for Combination Play
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Execute basic wall passes at reduced speed
  - Use a simple supporting movement after passing
  - Adjust passing technique to play to feet rather than space in combination situations
- id: u14-b2-passing-movement-intro
  age: u14
  block: B2
  area: Passing & Movement
  level: intro
  tracks:
  - rec
  bullets:
  - Pass and then move to a new supporting position rather than watching the pass
  - Offer a clear option when a teammate has the ball and understand basic spacing around the ball carrier
- id: u14-b2-decision-making-intro
  age: u14
  block: B2
  area: Decision-Making
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Recognize the basic choice between combining with a teammate and carrying forward individually
  - Begin choosing between pass-and-move and carry based on where the defender is
  - Make simple combination decisions without waiting to be told
- id: u14-b3-perception-preparation-intro
  age: u14
  block: B3
  area: Perception & Preparation
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - React to losing the ball with immediate urgency
  - Identify the ball carrier as the first priority
  - Recognize nearby teammates as defensive support
- id: u14-b3-covering-intro
  age: u14
  block: B3
  area: Covering
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Recognize the importance of helping a teammate who is pressing
  - Begin to understand basic cover position behind the ball
  - Stay connected to the nearest teammate rather than isolated
- id: u14-b3-shape-line-management-intro
  age: u14
  block: B3
  area: Shape & Line Management
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Understand that the team defends as a connected group, not individuals
  - Begin to recognize when the team is too spread out
  - Recover into a basic defensive shape after losing the ball
- id: u14-b3-defensive-decision-making-intro
  age: u14
  block: B3
  area: Defensive Decision-Making
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Understand the basic choice between pressing and delaying
  - Begin to recover goal-side when beaten
  - Recognize the importance of helping teammates defend rather than defending alone
- id: u14-b4-perception-awareness-intro
  age: u14
  block: B4
  area: Perception & Awareness
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Recognize the moment possession has changed
  - Identify the immediate attacking or defensive cue that follows
  - Begin scanning during chaotic, fast-moving moments
- id: u14-b4-reaction-speed-intro
  age: u14
  block: B4
  area: Reaction & Speed
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - React quickly after losing or winning the ball
  - Accelerate toward the ball or space without hesitation
  - Attempt a forward pass after regaining possession when available
- id: u14-b4-decision-making-intro
  age: u14
  block: B4
  area: Decision-Making
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Choose between fast attack and holding possession after a regain
  - Recognize when the press has failed and the team must recover
  - Support teammates in transition rather than acting alone
- id: u14-b5-recognizing-the-moment-intro
  age: u14
  block: B5
  area: Recognizing the Moment
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Identify when in shooting or final-pass range
  - Notice goal location and basic pressure
  - Recognize simple scoring opportunities
- id: u14-b5-preparation-body-shape-intro
  age: u14
  block: B5
  area: Preparation & Body Shape
  level: intro
  tracks:
  - rec
  bullets:
  - Set the body to face goal when receiving near the box
  - Use a settling touch to prepare for a shot or pass
  - Show basic balance before striking the ball
- id: u14-b5-executing-final-actions-intro
  age: u14
  block: B5
  area: Executing Final Actions
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Use inside foot or simple laces technique to finish
  - Complete uncontested headers or rebounds
  - Execute basic cutbacks or square passes
- id: u14-b5-composure-ownership-intro
  age: u14
  block: B5
  area: Composure & Ownership
  level: intro
  tracks:
  - rec
  - comp
  bullets:
  - Willing to shoot or play the final pass
  - Accept missed chances without frustration
  - Reset quickly after attempts
- id: u14-b1-perception-preparation-dev-comp
  age: u14
  block: B1
  area: Perception & Preparation
  level: dev
  tracks:
  - comp
  bullets:
  - 'Scan twice before every reception: once for pressure, once for the next pass or run'
  - Body shape oriented to see the largest number of options before receiving, not just the nearest one
  - Recognize the difference between time to take a touch and a forced one-touch situation before the
    ball gets there
- id: u14-b1-perception-preparation-app-comp
  age: u14
  block: B1
  area: Perception & Preparation
  level: app
  tracks:
  - comp
  bullets:
  - Scan and prepare while a defender is actively closing, not against a static picture
  - Recognize disguised pressure, a defender showing late or from a blind angle, and adjust body shape
    in the moment it appears
- id: u14-b1-controlling-dev-comp
  age: u14
  block: B1
  area: Controlling
  level: dev
  tracks:
  - comp
  bullets:
  - First touch redirects the ball into space, not just to the foot
  - Receive across the body to open up the field in one motion
  - Control under direct physical pressure without losing the ball under the body
- id: u14-b1-controlling-app-comp
  age: u14
  block: B1
  area: Controlling
  level: app
  tracks:
  - comp
  bullets:
  - Make the first-touch decision in real time against a defender who is committed and moving at speed,
    not jogging into a passive challenge
  - Recover from a heavy or imperfect touch without panicking or losing the ball
- id: u14-b1-protecting-dev-comp
  age: u14
  block: B1
  area: Protecting
  level: dev
  tracks:
  - comp
  bullets:
  - Shield with the body positioned between the ball and the defender, not just turned away from it
  - Recognize when holding possession is the right call versus when it is just delaying the inevitable
  - Use the arm and body legally to buy a half-second, not to foul
- id: u14-b1-protecting-app-comp
  age: u14
  block: B1
  area: Protecting
  level: app
  tracks:
  - comp
  bullets:
  - Make the shield-or-release decision in real time against a fast-closing, fully committed defender
  - Protect the ball and recover composure after a heavy touch instead of losing it under pressure
- id: u14-b1-driving-dev-comp
  age: u14
  block: B1
  area: Driving
  level: dev
  tracks:
  - comp
  bullets:
  - Push the ball into space at speed when it is available, head up and aware of the next decision
  - Know the difference between driving to beat a press and driving recklessly into traffic
  - Accelerate out of the first touch rather than touch-and-stop
- id: u14-b1-driving-app-comp
  age: u14
  block: B1
  area: Driving
  level: app
  tracks:
  - comp
  bullets:
  - Execute the driving run against a defender who has scouted the tendency and is sitting on it
  - Read when to abandon the drive and recycle the ball when the picture has closed, without forcing it
- id: u14-b1-dribbling-dev-comp
  age: u14
  block: B1
  area: Dribbling
  level: dev
  tracks:
  - comp
  bullets:
  - Use a move to beat a defender 1v1 when the picture calls for it, not as a habit
  - Change of pace and direction to create real separation
  - Recognize when dribbling solves the problem and when it creates a worse one
- id: u14-b1-dribbling-app-comp
  age: u14
  block: B1
  area: Dribbling
  level: app
  tracks:
  - comp
  bullets:
  - Execute the 1v1 move against a defender who has scouted the tendency and is set to stop it
  - Read when to abandon the dribble and recycle possession when the picture has closed, without forcing
    it
- id: u14-b1-passing-dev-comp
  age: u14
  block: B1
  area: Passing
  level: dev
  tracks:
  - comp
  bullets:
  - Weight and accuracy on both feet under pressure, not just the strong foot
  - Disguise the pass with body shape so the defender cannot read it early
  - Play first time when the picture demands it, not just when it is comfortable
- id: u14-b1-passing-app-comp
  age: u14
  block: B1
  area: Passing
  level: app
  tracks:
  - comp
  bullets:
  - Execute the disguised or first-time pass against a defender actively trying to read body shape and
    intercept
  - Find the secure release under pressure even when the first option is taken away
- id: u14-b1-decision-making-dev-comp
  age: u14
  block: B1
  area: Decision-Making
  level: dev
  tracks:
  - comp
  bullets:
  - Make the right decision fast, not just the right decision
  - Recognize the picture before the ball arrives so the decision is already half-made
  - Hold composure when the first read is wrong and a second option is needed instantly
- id: u14-b1-decision-making-app-comp
  age: u14
  block: B1
  area: Decision-Making
  level: app
  tracks:
  - comp
  bullets:
  - Make a correct, fast decision when the picture changes after the first scan, the defender arrives
    sooner than expected, a lane closes late
  - Adjust under pressure without hesitation or panic, trusting the preparation already done
- id: u14-b2-perception-preparation-intro-comp
  age: u14
  block: B2
  area: Perception & Preparation
  level: intro
  tracks:
  - comp
  bullets:
  - Scan beyond the ball to identify nearby teammates
  - 'Recognize simple support positions: behind, beside, and ahead of the ball'
  - Identify when a teammate is under pressure and needs an outlet
- id: u14-b2-perception-preparation-dev-comp
  age: u14
  block: B2
  area: Perception & Preparation
  level: dev
  tracks:
  - comp
  bullets:
  - Scan to identify numbers-up situations before they develop
  - Recognize defensive pressure cues that signal the need to combine rather than carry
  - Anticipate teammate movement rather than reacting to it late
- id: u14-b2-perception-preparation-app-comp
  age: u14
  block: B2
  area: Perception & Preparation
  level: app
  tracks:
  - comp
  bullets:
  - 'CBs + Defensive Mid: Recognize when the back line is under press and identify the Defensive Mid as
    the first release; read when the press is broken and the CB can drive forward.'
  - 'CBs + Fullbacks/Wing Backs + Defensive Mid: Scan to identify which wide player has pushed forward
    and which has held, and adjust position to maintain coverage and options behind the ball.'
  - 'Fullbacks/Wing Backs + Attacking Mids + Wingers: Recognize when the Winger has drawn the defender
    inside and the overlap space has opened on the outside.'
  - 'Attacking Mids + Wingers + Strikers: Identify the third-man run before the combination starts, not
    after the first pass is made.'
- id: u14-b2-supporting-dev-comp
  age: u14
  block: B2
  area: Supporting
  level: dev
  tracks:
  - comp
  bullets:
  - Provide support at the correct angle, distance, and timing for the specific pressure the ball carrier
    faces
  - Move to open space rather than toward the ball when the ball carrier has time
  - Drop short or push in behind based on what the ball carrier needs, not what is most comfortable
- id: u14-b2-supporting-app-comp
  age: u14
  block: B2
  area: Supporting
  level: app
  tracks:
  - comp
  bullets:
  - 'CBs + Defensive Mid: The Defensive Mid drops into the space between the CBs under the press; the
    CBs split wide to create the triangle and force the press to commit to one side.'
  - 'CBs + Fullbacks/Wing Backs + Defensive Mid: When the CB has the ball, the Fullback/Wing Back provides
    the wide outlet and the Defensive Mid provides the central option; the CB reads which channel is open.'
  - 'Fullbacks/Wing Backs + Attacking Mids + Wingers: The Attacking Mid supports the wide combination
    by checking in to create a third option, keeping the combination alive if the first two options are
    taken away.'
  - 'Attacking Mids + Wingers + Strikers: The Striker drops short to pull the defender and create space
    for the Attacking Mid or Winger to run in behind; the supporting movement creates the advantage, not
    the pass.'
- id: u14-b2-technique-for-combination-play-dev-comp
  age: u14
  block: B2
  area: Technique for Combination Play
  level: dev
  tracks:
  - comp
  bullets:
  - Execute wall passes, overlaps, and simple third-man runs at game speed
  - Use first touch to set up the next combination action, not just to control
  - Adjust passing weight and surface for a moving teammate rather than a stationary one
- id: u14-b2-technique-for-combination-play-app-comp
  age: u14
  block: B2
  area: Technique for Combination Play
  level: app
  tracks:
  - comp
  bullets:
  - 'CBs + Defensive Mid: Execute the short combination under high press with one or two touches; technique
    must be clean enough that the press cannot recover between passes.'
  - 'CBs + Fullbacks/Wing Backs + Defensive Mid: The Fullback/Wing Back receives and plays back into the
    Defensive Mid with a first-time pass, then continues the run; quick enough that the defender cannot
    track both ball and run simultaneously.'
  - 'Fullbacks/Wing Backs + Attacking Mids + Wingers: Execute the overlap or underlap combination at pace;
    both players'' first touches must set up forward momentum, not slow the combination down.'
  - 'Attacking Mids + Wingers + Strikers: Execute the third-man combination cleanly under defensive pressure;
    the lay-off is weighted to the arriving player''s run, not to where they are standing.'
- id: u14-b2-passing-movement-intro-comp
  age: u14
  block: B2
  area: Passing & Movement
  level: intro
  tracks:
  - comp
  bullets:
  - Pass and then move to a new supporting position rather than watching the pass
  - Offer a clear option when a teammate has the ball
  - Understand basic spacing around the ball carrier
- id: u14-b2-passing-movement-dev-comp
  age: u14
  block: B2
  area: Passing & Movement
  level: dev
  tracks:
  - comp
  bullets:
  - Pass with purpose and move immediately to unbalance the defensive shape
  - Time the run after passing so it arrives when the ball is ready to come back
  - Recognize when to move toward the ball and when to move away from it to create space
- id: u14-b2-passing-movement-app-comp
  age: u14
  block: B2
  area: Passing & Movement
  level: app
  tracks:
  - comp
  bullets:
  - 'CBs + Defensive Mid: After playing into the Defensive Mid, the CB moves to continue the build-up
    as a forward option or covers the space vacated if the Def Mid turns and drives.'
  - 'CBs + Fullbacks/Wing Backs + Defensive Mid: After the Fullback/Wing Back passes into the Defensive
    Mid, they continue the run forward; the movement after the pass is the combination, not the pass itself.'
  - 'Fullbacks/Wing Backs + Attacking Mids + Wingers: After the overlap run, the Fullback/Wing Back continues
    toward the endline or cuts inside; the Winger or AM plays the ball in front of the run, not into the
    feet.'
  - 'Attacking Mids + Wingers + Strikers: After the Striker lays off, they immediately move to a new position
    to become the third-man option; the movement after the lay-off creates the next chance.'
- id: u14-b2-decision-making-dev-comp
  age: u14
  block: B2
  area: Decision-Making
  level: dev
  tracks:
  - comp
  bullets:
  - Decide quickly whether to combine, carry, or play forward based on the defensive shape in front
  - Recognize overload situations and choose the combination that exploits them
  - Read when the combination is available and when to abandon it and play safe
- id: u14-b2-decision-making-app-comp
  age: u14
  block: B2
  area: Decision-Making
  level: app
  tracks:
  - comp
  bullets:
  - 'CBs + Defensive Mid: Decide whether to play through the Defensive Mid or carry forward as a CB penetration
    based on where the press has committed; if the press commits to the Def Mid, the CB drives into the
    vacated space.'
  - 'CBs + Fullbacks/Wing Backs + Defensive Mid: The Fullback/Wing Back decides whether to combine short
    with the CB or play long into the Attacking Mid based on whether the Defensive Mid is marked; the
    decision is made before receiving, not after.'
  - 'Fullbacks/Wing Backs + Attacking Mids + Wingers: Decide whether the overlap or underlap is on based
    on which defender is positioned higher; the decision is made off the ball, not while carrying it.'
  - 'Attacking Mids + Wingers + Strikers: Decide whether to play the third-man combination or play forward
    directly based on how the defenders have positioned relative to the run; if the run is tracked, play
    forward, if the run is free, play the third-man.'
- id: u14-b3-perception-preparation-dev-comp
  age: u14
  block: B3
  area: Perception & Preparation
  level: dev
  tracks:
  - comp
  bullets:
  - Scan to recognize pressing triggers before the ball arrives at the target
  - 'Identify dangerous spaces: central channels, shooting lanes, space in behind'
  - Recognize the moment pressure has been broken and shape must adjust
- id: u14-b3-perception-preparation-app-comp
  age: u14
  block: B3
  area: Perception & Preparation
  level: app
  tracks:
  - comp
  bullets:
  - 'Strikers + Attacking Mids: Recognize the pressing trigger, a heavy touch, a backward pass, a pass
    into a closed body shape, and initiate the press instantly.'
  - 'Wingers + Fullbacks/Wing Backs: Scan to see both the ball and the switch option before showing the
    opponent inside.'
  - 'Attacking Mids + Defensive Mid: Recognize when the press has been beaten centrally and the passing
    lane must be screened immediately.'
  - 'Center Backs + Defensive Mid: Read the line height relative to the ball and recognize when to step
    and when to hold.'
- id: u14-b3-covering-dev-comp
  age: u14
  block: B3
  area: Covering
  level: dev
  tracks:
  - comp
  bullets:
  - Provide cover at the correct distance and angle for the specific press in front
  - Recognize when to slide across to cover a teammate who has stepped
  - Communicate cover position so the pressing teammate can commit fully
  - Close mark with an eye on both the ball and your opponent, and mark closer the closer you are to goal
  - Stay in your zone when the opponent moves, and pass the runner on or pick up the one coming in
- id: u14-b3-covering-app-comp
  age: u14
  block: B3
  area: Covering
  level: app
  tracks:
  - comp
  bullets:
  - 'Strikers + Attacking Mids: The second Striker or AM covers the passing lane the first press has shown
    the opponent away from, closing the release before it happens.'
  - 'Wingers + Fullbacks/Wing Backs: The Fullback/Wing Back covers in behind the Winger''s press, ready
    for the ball played in behind or square.'
  - 'Attacking Mids + Defensive Mid: The Defensive Mid covers centrally while the AM presses, staying
    connected enough to prevent the central lane opening.'
  - 'Center Backs + Defensive Mid: The covering CB reads the stepping CB''s press and adjusts the line
    so no gap opens in behind.'
  - Switch from zonal to player marking when it is needed
- id: u14-b3-shape-line-management-dev-comp
  age: u14
  block: B3
  area: Shape & Line Management
  level: dev
  tracks:
  - comp
  bullets:
  - Maintain compactness vertically and horizontally as a unit
  - Shift as a group toward the ball rather than defending in isolation
  - Recognize when the team shape has been broken and needs to reset
- id: u14-b3-shape-line-management-app-comp
  age: u14
  block: B3
  area: Shape & Line Management
  level: app
  tracks:
  - comp
  bullets:
  - 'Strikers + Attacking Mids: Set the height of the press and manage the distance to the midfield line
    so the block doesn''t get split.'
  - 'Wingers + Fullbacks/Wing Backs: Maintain width discipline so the team stays compact centrally without
    conceding the flank entirely.'
  - 'Attacking Mids + Defensive Mid: Manage the distance between the midfield and defensive lines, the
    space most likely to be exploited by combination play.'
  - 'Center Backs + Defensive Mid: Control the height of the back line, manage the offside trigger, and
    stay connected to the Defensive Mid above.'
- id: u14-b3-defensive-decision-making-dev-comp
  age: u14
  block: B3
  area: Defensive Decision-Making
  level: dev
  tracks:
  - comp
  bullets:
  - Decide when to step, delay, or recover based on the picture in front
  - Shift as a unit toward the ball rather than making an individual decision
  - Deny penetration and force play into less dangerous areas
- id: u14-b3-defensive-decision-making-app-comp
  age: u14
  block: B3
  area: Defensive Decision-Making
  level: app
  tracks:
  - comp
  bullets:
  - 'Strikers + Attacking Mids: Decide whether to press the ball or screen the pass based on whether the
    press can arrive before the ball is released.'
  - 'Wingers + Fullbacks/Wing Backs: Decide whether to show inside or outside based on team shape and
    where cover is positioned.'
  - 'Attacking Mids + Defensive Mid: Decide whether to jump the passing lane or hold position based on
    the risk of being played through.'
  - 'Center Backs + Defensive Mid: Decide whether to step and engage or hold the line, understanding that
    stepping wrong breaks the entire defensive structure.'
- id: u14-b4-perception-awareness-dev-comp
  age: u14
  block: B4
  area: Perception & Awareness
  level: dev
  tracks:
  - comp
  bullets:
  - Understand the difference between playing fast and recovering shape, and recognize which the moment
    demands
  - Choose action instead of freezing when the picture is unclear
  - Recognize that hesitation itself creates a disadvantage
- id: u14-b4-perception-awareness-app-comp
  age: u14
  block: B4
  area: Perception & Awareness
  level: app
  tracks:
  - comp
  bullets:
  - 'Att → Def: Counter-Press Trigger: Recognize instantly whether the team is positioned to win the ball
    back within the first few seconds.'
  - 'Att → Def: Recovery: Recognize when the counter-press is not on and sprint into recovery shape without
    waiting to be told.'
  - 'Def → Att: First Action Forward: Recognize the moment of the regain and identify the forward option
    before the first touch.'
  - 'Def → Att: Support the Counter: Recognize space opening in behind the defense the instant possession
    changes, not a second later.'
- id: u14-b4-reaction-speed-dev-comp
  age: u14
  block: B4
  area: Reaction & Speed
  level: dev
  tracks:
  - comp
  bullets:
  - Identify numbers-up or numbers-down situations in the transition moment
