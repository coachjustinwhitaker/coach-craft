- id: u14-b5-composure-ownership-app-comp
  age: u14
  block: B5
  area: Composure & Ownership
  level: app
  tracks:
  - comp
  bullets:
  - 'Strikers + Wingers: The Finish: Build the habit of refocusing immediately after a missed chance,
    through repetition.'
  - 'Attacking Mids + Wingers: The Final Pass: Take ownership of the risk in playing the final ball, reinforced
    by how it is coached: praise the attempted through ball that gets intercepted as much as the one that
    connects, so the decision to try stays the same regardless of outcome.'
  - 'Fullbacks/Wing Backs + Attacking Mids: Delivery from Wide: Build the delivery decision through repetition
    under time pressure until picking the right ball, cross or cutback, becomes the default rather than
    a choice made under stress.'
  - 'All Positions: Numbers in the Box / Game State: Give players a specific job and communication trigger
    for the moment, who calls the game state, what gets said when protecting a lead versus chasing a goal,
    so the response is a rehearsed habit, not a personality trait some players have and others don''t.'
- id: u14-b3-denying-the-finish-intro
  age: u14
  block: B3
  area: Denying the Finish
  level: intro
  tracks:
  - comp
  - rec
  bullets:
  - Get narrow and close the center near goal
  - Pressure the player on the ball so he cannot shoot or cross freely
  - Block the shot when the opponent is about to attempt on goal
  - Turn your shoulders and hips 45 to 90 degrees toward your own goal
  - Look for the ball, the nearest teammates and the nearest opponents in relation to your goal
