  - Begin anticipating transition moments before they fully occur
- id: u14-b4-reaction-speed-app-comp
  age: u14
  block: B4
  area: Reaction & Speed
  level: app
  tracks:
  - comp
  bullets:
  - 'Att → Def: Counter-Press Trigger: Sprint to close the ball within the first two to three seconds,
    cutting off the easiest release.'
  - 'Att → Def: Recovery: Sprint into a compact shape that protects the most dangerous space, prioritizing
    position over the ball.'
  - 'Def → Att: First Action Forward: Play the first pass or touch forward at maximum tempo the instant
    the ball is won.'
  - 'Def → Att: Support the Counter: Sprint beyond the ball into space before the defense can reorganize.'
