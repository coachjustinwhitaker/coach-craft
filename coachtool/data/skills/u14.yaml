  bullets:
  - 'Att → Def: Counter-Press Trigger: Decide whether to commit to the press or drop into shape based
    on numbers around the ball, not habit.'
  - 'Att → Def: Recovery: Decide the priority order of what to protect first, central danger, then the
    ball.'
  - 'Def → Att: First Action Forward: Decide between playing forward immediately or securing possession
    based on what the picture actually shows, not what is comfortable.'
  - 'Def → Att: Support the Counter: Decide whether to join the counter or hold position to protect against
    a second loss of possession.'
