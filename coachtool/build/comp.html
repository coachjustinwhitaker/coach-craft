-dev-comp", "age": "u14", "block": "B1", "area": "Protecting", "level": "dev", "tracks": ["comp"], "bullets": ["Shield with the body positioned between the ball and the defender, not just turned away from it", "Recognize when holding possession is the right call versus when it is just delaying the inevitable", "Use the arm and body legally to buy a half-second, not to foul"]}, {"id": "u14-b1-protecting-app-comp", "age": "u14", "block": "B1", "area": "Protecting", "level": "app", "tracks": ["comp"], "bullets": ["Make the shield-or-release decision in real time against a fast-closing, fully committed defender", "Protect the ball and recover composure after a heavy touch instead of losing it under pressure"]}, {"id": "u14-b1-driving-dev-comp", "age": "u14", "block": "B1", "area": "Driving", "level": "dev", "tracks": ["comp"], "bullets": ["Push the ball into space at speed when it is available, head up and aware of the next decision", "Know the difference between driving to beat a press and driving recklessly into traffic", "Accelerate out of the first touch rather than touch-and-stop"]}, {"id": "u14-b1-driving-app-comp", "age": "u14", "block": "B1", "area": "Driving", "level": "app", "tracks": ["comp"], "bullets": ["Execute the driving run against a defender who has scouted the tendency and is sitting on it", "Read when to abandon the drive and recycle the ball when the picture has closed, without forcing it"]}, {"id": "u14-b1-dribbling-dev-comp", "age": "u14", "block": "B1", "area": "Dribbling", "level": "dev", "tracks": ["comp"], "bullets": ["Use a move to beat a defender 1v1 when the picture calls for it, not as a habit", "Change of pace and direction to create real separation", "Recognize when dribbling solves the problem and when it creates a worse one"]}, {"id": "u14-b1-dribbling-app-comp", "age": "u14", "block": "B1", "area": "Dribbling", "level": "app", "tracks": ["comp"], "bullets": ["Execute the 1v1 move against a defender who has scouted the tendency and is set to stop it", "Read when to abandon the dribble and recycle possession when the picture has closed, without forcing it"]}, {"id": "u14-b1-passing-dev-comp", "age": "u14", "block": "B1", "area": "Passing", "level": "dev", "tracks": ["comp"], "bullets": ["Weight and accuracy on both feet under pressure, not just the strong foot", "Disguise the pass with body shape so the defender cannot read it early", "Play first time when the picture demands it, not just when it is comfortable"]}, {"id": "u14-b1-passing-app-comp", "age": "u14", "block": "B1", "area": "Passing", "level": "app", "tracks": ["comp"], "bullets": ["Execute the disguised or first-time pass against a defender actively trying to read body shape and intercept", "Find the secure release under pressure even when the first option is taken away"]}, {"id": "u14-b1-decision-making-dev-comp", "age": "u14", "block": "B1", "area": "Decision-Making", "level": "dev", "tracks": ["comp"], "bullets": ["Make the right decision fast, not just the right decision", "Recognize the picture before the ball arrives so the decision is already half-made", "Hold composure when the first read is wrong and a second option is needed instantly"]}, {"id": "u14-b1-decision-making-app-comp", "age": "u14", "block": "B1", "area": "Decision-Making", "level": "app", "tracks": ["comp"], "bullets": ["Make a correct, fast decision when the picture changes after the first scan, the defender arrives sooner than expected, a lane closes late", "Adjust under pressure without hesitation or panic, trusting the preparation already done"]}, {"id": "u14-b2-perception-preparation-intro-comp", "age": "u14", "block": "B2", "area": "Perception & Preparation", "level": "intro", "tracks": ["comp"], "bullets": ["Scan beyond the ball to identify nearby teammates", "Recognize simple support positions: behind, beside, and ahead of the ball", "Identify when a teammate is under pressure and needs an outlet"]}, {"id": "u14-b2-perception-preparation-dev-comp", "age": "u14", "block": "B2", "area": "Perception & Preparation", "level": "dev", "tracks": ["comp"], "bullets": ["Scan to identify numbers-up situations before they develop", "Recognize defensive pressure cues that signal the need to combine rather than carry", "Anticipate teammate movement rather than reacting to it late"]}, {"id": "u14-b2-perception-preparation-app-comp", "age": "u14", "block": "B2", "area": "Perception & Preparation", "level": "app", "tracks": ["comp"], "bullets": ["CBs + Defensive Mid: Recognize when the back line is under press and identify the Defensive Mid as the first release; read when the press is broken and the CB can drive forward.", "CBs + Fullbacks/Wing Backs + Defensive Mid: Scan to identify which wide player has pushed forward and which has held, and adjust position to maintain coverage and options behind the ball.", "Fullbacks/Wing Backs + Attacking Mids + Wingers: Recognize when the Winger has drawn the defender inside and the overlap space has opened on the outside.", "Attacking Mids + Wingers + Strikers: Identify the third-man run before the combination starts, not after the first pass is made."]}, {"id": "u14-b2-supporting-dev-comp", "age": "u14", "block": "B2", "area": "Supporting", "level": "dev", "tracks": ["comp"], "bullets": ["Provide support at the correct angle, distance, and timing for the specific pressure the ball carrier faces", "Move to open space rather than toward the ball when the ball carrier has time", "Drop short or push in behind based on what the ball carrier needs, not what is most comfortable"]}, {"id": "u14-b2-supporting-app-comp", "age": "u14", "block": "B2", "area": "Supporting", "level": "app", "tracks": ["comp"], "bullets": ["CBs + Defensive Mid: The Defensive Mid drops into the space between the CBs under the press; the CBs split wide to create the triangle and force the press to commit to one side.", "CBs + Fullbacks/Wing Backs + Defensive Mid: When the CB has the ball, the Fullback/Wing Back provides the wide outlet and the Defensive Mid provides the central option; the CB reads which channel is open.", "Fullbacks/Wing Backs + Attacking Mids + Wingers: The Attacking Mid supports the wide combination by checking in to create a third option, keeping the combination alive if the first two options are taken away.", "Attacking Mids + Wingers + Strikers: The Striker drops short to pull the defender and create space for the Attacking Mid or Winger to run in behind; the supporting movement creates the advantage, not the pass."]}, {"id": "u14-b2-technique-for-combination-play-dev-comp", "age": "u14", "block": "B2", "area": "Technique for Combination Play", "level": "dev", "tracks": ["comp"], "bullets": ["Execute wall passes, overlaps, and simple third-man runs at game speed", "Use first touch to set up the next combination action, not just to control", "Adjust passing weight and surface for a moving teammate rather than a stationary one"]}, {"id": "u14-b2-technique-for-combination-play-app-comp", "age": "u14", "block": "B2", "area": "Technique for Combination Play", "level": "app", "tracks": ["comp"], "bullets": ["CBs + Defensive Mid: Execute the short combination under high press with one or two touches; technique must be clean enough that the press cannot recover between passes.", "CBs + Fullbacks/Wing Backs + Defensive Mid: The Fullback/Wing Back receives and plays back into the Defensive Mid with a first-time pass, then continues the run; quick enough that the defender cannot track both ball and run simultaneously.", "Fullbacks/Wing Backs + Attacking Mids + Wingers: Execute the overlap or underlap combination at pace; both players' first touches must set up forward momentum, not slow the combination down.", "Attacking Mids + Wingers + Strikers: Execute the third-man combination cleanly under defensive pressure; the lay-off is weighted to the arriving player's run, not to where they are standing."]}, {"id": "u14-b2-passing-movement-intro-comp", "age": "u14", "block": "B2", "area": "Passing & Movement", "level": "intro", "tracks": ["comp"], "bullets": ["Pass and then move to a new supporting position rather than watching the pass", "Offer a clear option when a teammate has the ball", "Understand basic spacing around the ball carrier"]}, {"id": "u14-b2-passing-movement-dev-comp", "age": "u14", "block": "B2", "area": "Passing & Movement", "level": "dev", "tracks": ["comp"], "bullets": ["Pass with purpose and move immediately to unbalance the defensive shape", "Time the run after passing so it arrives when the ball is ready to come back", "Recognize when to move toward the ball and when to move away from it to create space"]}, {"id": "u14-b2-passing-movement-app-comp", "age": "u14", "block": "B2", "area": "Passing & Movement", "level": "app", "tracks": ["comp"], "bullets": ["CBs + Defensive Mid: After playing into the Defensive Mid, the CB moves to continue the build-up as a forward option or covers the space vacated if the Def Mid turns and drives.", "CBs + Fullbacks/Wing Backs + Defensive Mid: After the Fullback/Wing Back passes into the Defensive Mid, they continue the run forward; the movement after the pass is the combination, not the pass itself.", "Fullbacks/Wing Backs + Attacking Mids + Wingers: After the overlap run, the Fullback/Wing Back continues toward the endline or cuts inside; the Winger or AM plays the ball in front of the run, not into the feet.", "Attacking Mids + Wingers + Strikers: After the Striker lays off, they immediately move to a new position to become the third-man option; the movement after the lay-off creates the next chance."]}, {"id": "u14-b2-decision-making-dev-comp", "age": "u14", "block": "B2", "area": "Decision-Making", "level": "dev", "tracks": ["comp"], "bullets": ["Decide quickly whether to combine, carry, or play forward based on the defensive shape in front", "Recognize overload situations and choose the combination that exploits them", "Read when the combination is available and when to abandon it and play safe"]}, {"id": "u14-b2-decision-making-app-comp", "age": "u14", "block": "B2", "area": "Decision-Making", "level": "app", "tracks": ["comp"], "bullets": ["CBs + Defensive Mid: Decide whether to play through the Defensive Mid or carry forward as a CB penetration based on where the press has committed; if the press commits to the Def Mid, the CB drives into the vacated space.", "CBs + Fullbacks/Wing Backs + Defensive Mid: The Fullback/Wing Back decides whether to combine short with the CB or play long into the Attacking Mid based on whether the Defensive Mid is marked; the decision is made before receiving, not after.", "Fullbacks/Wing Backs + Attacking Mids + Wingers: Decide whether the overlap or underlap is on based on which defender is positioned higher; the decision is made off the ball, not while carrying it.", "Attacking Mids + Wingers + Strikers: Decide whether to play the third-man combination or play forward directly based on how the defenders have positioned relative to the run; if the run is tracked, play forward, if the run is free, play the third-man."]}, {"id": "u14-b3-perception-preparation-dev-comp", "age": "u14", "block": "B3", "area": "Perception & Preparation", "level": "dev", "tracks": ["comp"], "bullets": ["Scan to recognize pressing triggers before the ball arrives at the target", "Identify dangerous spaces: central channels, shooting lanes, space in behind", "Recognize the moment pressure has been broken and shape must adjust"]}, {"id": "u14-b3-perception-preparation-app-comp", "age": "u14", "block": "B3", "area": "Perception & Preparation", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Attacking Mids: Recognize the pressing trigger, a heavy touch, a backward pass, a pass into a closed body shape, and initiate the press instantly.", "Wingers + Fullbacks/Wing Backs: Scan to see both the ball and the switch option before showing the opponent inside.", "Attacking Mids + Defensive Mid: Recognize when the press has been beaten centrally and the passing lane must be screened immediately.", "Center Backs + Defensive Mid: Read the line height relative to the ball and recognize when to step and when to hold."]}, {"id": "u14-b3-covering-dev-comp", "age": "u14", "block": "B3", "area": "Covering", "level": "dev", "tracks": ["comp"], "bullets": ["Provide cover at the correct distance and angle for the specific press in front", "Recognize when to slide across to cover a teammate who has stepped", "Communicate cover position so the pressing teammate can commit fully", "Close mark with an eye on both the ball and your opponent, and mark closer the closer you are to goal", "Stay in your zone when the opponent moves, and pass the runner on or pick up the one coming in"]}, {"id": "u14-b3-covering-app-comp", "age": "u14", "block": "B3", "area": "Covering", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Attacking Mids: The second Striker or AM covers the passing lane the first press has shown the opponent away from, closing the release before it happens.", "Wingers + Fullbacks/Wing Backs: The Fullback/Wing Back covers in behind the Winger's press, ready for the ball played in behind or square.", "Attacking Mids + Defensive Mid: The Defensive Mid covers centrally while the AM presses, staying connected enough to prevent the central lane opening.", "Center Backs + Defensive Mid: The covering CB reads the stepping CB's press and adjusts the line so no gap opens in behind.", "Switch from zonal to player marking when it is needed"]}, {"id": "u14-b3-shape-line-management-dev-comp", "age": "u14", "block": "B3", "area": "Shape & Line Management", "level": "dev", "tracks": ["comp"], "bullets": ["Maintain compactness vertically and horizontally as a unit", "Shift as a group toward the ball rather than defending in isolation", "Recognize when the team shape has been broken and needs to reset"]}, {"id": "u14-b3-shape-line-management-app-comp", "age": "u14", "block": "B3", "area": "Shape & Line Management", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Attacking Mids: Set the height of the press and manage the distance to the midfield line so the block doesn't get split.", "Wingers + Fullbacks/Wing Backs: Maintain width discipline so the team stays compact centrally without conceding the flank entirely.", "Attacking Mids + Defensive Mid: Manage the distance between the midfield and defensive lines, the space most likely to be exploited by combination play.", "Center Backs + Defensive Mid: Control the height of the back line, manage the offside trigger, and stay connected to the Defensive Mid above."]}, {"id": "u14-b3-defensive-decision-making-dev-comp", "age": "u14", "block": "B3", "area": "Defensive Decision-Making", "level": "dev", "tracks": ["comp"], "bullets": ["Decide when to step, delay, or recover based on the picture in front", "Shift as a unit toward the ball rather than making an individual decision", "Deny penetration and force play into less dangerous areas"]}, {"id": "u14-b3-defensive-decision-making-app-comp", "age": "u14", "block": "B3", "area": "Defensive Decision-Making", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Attacking Mids: Decide whether to press the ball or screen the pass based on whether the press can arrive before the ball is released.", "Wingers + Fullbacks/Wing Backs: Decide whether to show inside or outside based on team shape and where cover is positioned.", "Attacking Mids + Defensive Mid: Decide whether to jump the passing lane or hold position based on the risk of being played through.", "Center Backs + Defensive Mid: Decide whether to step and engage or hold the line, understanding that stepping wrong breaks the entire defensive structure."]}, {"id": "u14-b4-perception-awareness-dev-comp", "age": "u14", "block": "B4", "area": "Perception & Awareness", "level": "dev", "tracks": ["comp"], "bullets": ["Understand the difference between playing fast and recovering shape, and recognize which the moment demands", "Choose action instead of freezing when the picture is unclear", "Recognize that hesitation itself creates a disadvantage"]}, {"id": "u14-b4-perception-awareness-app-comp", "age": "u14", "block": "B4", "area": "Perception & Awareness", "level": "app", "tracks": ["comp"], "bullets": ["Att → Def: Counter-Press Trigger: Recognize instantly whether the team is positioned to win the ball back within the first few seconds.", "Att → Def: Recovery: Recognize when the counter-press is not on and sprint into recovery shape without waiting to be told.", "Def → Att: First Action Forward: Recognize the moment of the regain and identify the forward option before the first touch.", "Def → Att: Support the Counter: Recognize space opening in behind the defense the instant possession changes, not a second later."]}, {"id": "u14-b4-reaction-speed-dev-comp", "age": "u14", "block": "B4", "area": "Reaction & Speed", "level": "dev", "tracks": ["comp"], "bullets": ["Identify numbers-up or numbers-down situations in the transition moment", "Recognize when space is available to attack immediately", "Begin anticipating transition moments before they fully occur"]}, {"id": "u14-b4-reaction-speed-app-comp", "age": "u14", "block": "B4", "area": "Reaction & Speed", "level": "app", "tracks": ["comp"], "bullets": ["Att → Def: Counter-Press Trigger: Sprint to close the ball within the first two to three seconds, cutting off the easiest release.", "Att → Def: Recovery: Sprint into a compact shape that protects the most dangerous space, prioritizing position over the ball.", "Def → Att: First Action Forward: Play the first pass or touch forward at maximum tempo the instant the ball is won.", "Def → Att: Support the Counter: Sprint beyond the ball into space before the defense can reorganize."]}, {"id": "u14-b4-decision-making-dev-comp", "age": "u14", "block": "B4", "area": "Decision-Making", "level": "dev", "tracks": ["comp"], "bullets": ["Read transition cues in real time: numbers, space, and risk", "Recognize the team's game state, whether the moment calls for risk or control", "Communicate and organize teammates during the transition itself"]}, {"id": "u14-b4-decision-making-app-comp", "age": "u14", "block": "B4", "area": "Decision-Making", "level": "app", "tracks": ["comp"], "bullets": ["Att → Def: Counter-Press Trigger: Decide whether to commit to the press or drop into shape based on numbers around the ball, not habit.", "Att → Def: Recovery: Decide the priority order of what to protect first, central danger, then the ball.", "Def → Att: First Action Forward: Decide between playing forward immediately or securing possession based on what the picture actually shows, not what is comfortable.", "Def → Att: Support the Counter: Decide whether to join the counter or hold position to protect against a second loss of possession."]}, {"id": "u14-b5-recognizing-the-moment-dev-comp", "age": "u14", "block": "B5", "area": "Recognizing the Moment", "level": "dev", "tracks": ["comp"], "bullets": ["Read defender distance and goalkeeper position before acting", "Distinguish between shooting, passing, or recycling", "Anticipate second-ball and rebound opportunities"]}, {"id": "u14-b5-recognizing-the-moment-app-comp", "age": "u14", "block": "B5", "area": "Recognizing the Moment", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Wingers: The Finish: Recognize the exact moment a shooting window opens under closing pressure, often less than a second.", "Attacking Mids + Wingers: The Final Pass: Recognize when a teammate has separated and the passing lane is live before the defender recovers.", "Fullbacks/Wing Backs + Attacking Mids: Delivery from Wide: Recognize the right moment to deliver, early before the box is set, or late for a cutback once runners arrive.", "All Positions: Numbers in the Box / Game State: Recognize when the moment calls for numbers forward and when it calls for restraint based on the score and time remaining."]}, {"id": "u14-b5-preparation-body-shape-intro-comp", "age": "u14", "block": "B5", "area": "Preparation & Body Shape", "level": "intro", "tracks": ["comp"], "bullets": ["Set body to face goal when receiving near the box", "Use a settling touch to prepare for a shot or pass", "Show basic balance before striking the ball"]}, {"id": "u14-b5-preparation-body-shape-dev-comp", "age": "u14", "block": "B5", "area": "Preparation & Body Shape", "level": "dev", "tracks": ["comp"], "bullets": ["Adjust body shape to shoot with one or two touches", "Prepare for first-time finishes when appropriate", "Set feet and hips quickly as pressure arrives"]}, {"id": "u14-b5-preparation-body-shape-app-comp", "age": "u14", "block": "B5", "area": "Preparation & Body Shape", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Wingers: The Finish: Prepare the body to strike while still moving at speed, with a defender or goalkeeper closing the angle.", "Attacking Mids + Wingers: The Final Pass: Prepare the body to disguise the final pass so the defender cannot read through ball versus cutback.", "Fullbacks/Wing Backs + Attacking Mids: Delivery from Wide: Prepare body shape to strike a moving ball at pace without breaking stride, keeping the delivery options open until the last moment.", "All Positions: Numbers in the Box / Game State: Prepare mentally for the moment before it arrives, know your job in the box before the ball is delivered."]}, {"id": "u14-b5-executing-final-actions-dev-comp", "age": "u14", "block": "B5", "area": "Executing Final Actions", "level": "dev", "tracks": ["comp"], "bullets": ["Finish under light-to-moderate defensive pressure", "Execute volleys and half-volleys in live play", "Choose placement vs. power based on the situation"]}, {"id": "u14-b5-executing-final-actions-app-comp", "age": "u14", "block": "B5", "area": "Executing Final Actions", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Wingers: The Finish: Finish through contact and tight windows with limited touches, taking on the defender 1v1 to create or score when the picture calls for it.", "Attacking Mids + Wingers: The Final Pass: Execute the through ball or combination pass that breaks the last line under high pressure.", "Fullbacks/Wing Backs + Attacking Mids: Delivery from Wide: Deliver a cross or cutback with the weight and pace to reach a moving target, not just the space.", "All Positions: Numbers in the Box / Game State: Arrive in the correct zone in the box to convert a delivery, or manage the ball late to protect the result."]}, {"id": "u14-b5-composure-ownership-dev-comp", "age": "u14", "block": "B5", "area": "Composure & Ownership", "level": "dev", "tracks": ["comp"], "bullets": ["Stay composed as pressure and stakes increase", "Take responsibility for decisive moments", "Respond positively after success or failure"]}, {"id": "u14-b5-composure-ownership-app-comp", "age": "u14", "block": "B5", "area": "Composure & Ownership", "level": "app", "tracks": ["comp"], "bullets": ["Strikers + Wingers: The Finish: Build the habit of refocusing immediately after a missed chance, through repetition.", "Attacking Mids + Wingers: The Final Pass: Take ownership of the risk in playing the final ball, reinforced by how it is coached: praise the attempted through ball that gets intercepted as much as the one that connects, so the decision to try stays the same regardless of outcome.", "Fullbacks/Wing Backs + Attacking Mids: Delivery from Wide: Build the delivery decision through repetition under time pressure until picking the right ball, cross or cutback, becomes the default rather than a choice made under stress.", "All Positions: Numbers in the Box / Game State: Give players a specific job and communication trigger for the moment, who calls the game state, what gets said when protecting a lead versus chasing a goal, so the response is a rehearsed habit, not a personality trait some players have and others don't."]}, {"id": "u14-b3-denying-the-finish-intro", "age": "u14", "block": "B3", "area": "Denying the Finish", "level": "intro", "tracks": ["comp", "rec"], "bullets": ["Get narrow and close the center near goal", "Pressure the player on the ball so he cannot shoot or cross freely", "Block the shot when the opponent is about to attempt on goal", "Turn your shoulders and hips 45 to 90 degrees toward your own goal", "Look for the ball, the nearest teammates and the nearest opponents in relation to your goal"]}, {"id": "u14-b3-denying-the-finish-dev-comp", "age": "u14", "block": "B3", "area": "Denying the Finish", "level": "dev", "tracks": ["comp"], "bullets": ["Deny the cross into space or to a player", "Stop the opponent from passing or running to receive behind the defensive line"]}, {"id": "u14-b3-denying-the-finish-app-comp", "age": "u14", "block": "B3", "area": "Denying the Finish", "level": "app", "tracks": ["comp"], "bullets": ["Engage and commit on a chance on goal without being eliminated by the dribble", "Defend the cross as a group: weak-side fullback connects to the back line and center backs stay central", "Win the second ball or clear it after the block", "Intercept a long ball at its highest point"]}], "club": {}, "rules": [{"label": "Format", "text": "11v11. US Soccer's small-sided chart ends at U12, so U13 and up play the full game.", "source": "US Soccer Player Development Initiatives (chart covers U6 to U12)", "origin": "core"}, {"label": "Ball", "text": "Size 5", "source": "Laws of the Game", "origin": "core"}, {"label": "Offside", "text": "Offside applies.", "source": "Laws of the Game", "origin": "core"}, {"label": "Head injuries", "text": "If a head injury is suspected, play stops for evaluation. The player may be substituted. Return requires clearance from a health care professional or certified athletic trainer.", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}], "ladder": ["B1", "B2", "B3", "B4", "B5"]}], "blocks": {"B1": {"name": "Me & the Ball", "group_label": "Individual skill, pressure, scanning, body shape", "css": ""}, "B2": {"name": "Me & My Teammates", "group_label": "Passing, combination play, creating and using space", "css": ""}, "B3": {"name": "Me & My Team Defending", "group_label": "Pressing, delaying, covering, marking, staying compact", "css": "defending"}, "B4": {"name": "Me & the Game", "group_label": "Both transitions: the moment we lose it and the moment we win it", "css": ""}, "B5": {"name": "Me & the Moment", "group_label": "Finishing, composure, game management", "css": ""}, "D": {"name": "Discovery", "group_label": "Movement, ball comfort and joy", "css": ""}}, "ladder": {"rec": {"u6": ["D", "B1"], "u8": ["B1", "B2"], "u10": ["B1", "B2", "B3"], "u12": ["B1", "B2", "B3", "B4"], "u14": ["B1", "B2", "B3", "B4", "B5"]}, "comp": {"u10": ["B1", "B2", "B3"], "u12": ["B1", "B2", "B3", "B4", "B5"], "u14": ["B1", "B2", "B3", "B4", "B5"]}, "levels": {"rec": ["intro"], "comp": ["intro", "dev", "app"]}}, "types": [{"id": "ball-mastery", "label": "Ball mastery"}, {"id": "warm-up", "label": "Warm-up"}, {"id": "pattern", "label": "Passing pattern"}, {"id": "rondo", "label": "Rondo or possession"}, {"id": "opening-play", "label": "Opening play"}, {"id": "small-sided", "label": "Small-sided game"}, {"id": "positional", "label": "Positional work"}, {"id": "full-game", "label": "Full game"}, {"id": "set-piece", "label": "Set piece"}, {"id": "fitness", "label": "Fitness"}], "routines": [{"id": "captain-led-dynamic-warm-up", "name": "Captain-Led Dynamic Warm-Up", "kind": "dynamic-warm-up", "objective": "Prepare the body for a high-tempo session with a captain-led sequence and no ball.", "ages": ["u14"], "tracks": ["comp"], "dosage": "Captains lead their line's pace. Straight through with no stopping between movements, about 10 minutes.", "equipment": "Cones to mark the working area. No ball.", "steps": [{"name": "Light Jog", "how": "Easy jog across the working area and back to loosen up.", "cue": "Easy pace, stay relaxed."}, {"name": "High Knees", "how": "Run in a straight line, driving the knees up toward the waist.", "cue": "Knees to the waist, quick feet."}, {"name": "Butt Kicks", "how": "Run in a straight line, kicking the heels up toward the backside.", "cue": "Heels to the backside, stay tall."}, {"name": "Straight-Leg Walks", "how": "Walk forward, swinging one straight leg up toward the opposite hand, alternating legs.", "cue": "Tall posture, straight leg, reach for the hand."}, {"name": "Lateral Shuffle", "how": "Stay low and shuffle sideways without crossing the feet. Go one way, then back the other way.", "cue": "Stay low, feet never cross."}, {"name": "Carioca", "how": "Travel sideways, crossing the trailing foot in front, then behind, with the hips turning. Go one way, then back the other way.", "cue": "Hips turn, feet cross front then back."}, {"name": "Walking Lunge With Rotation", "how": "Step into a lunge and rotate the upper body toward the front leg. Stand, step, and repeat on the other side.", "cue": "Long step, rotate toward the front leg."}, {"name": "Leg Swings", "how": "Hold a teammate or stand tall. Swing one leg front to back, then side to side. Switch legs.", "cue": "Control the swing, stay tall."}, {"name": "Build-Up Strides", "how": "Three strides, building from 75 to 90 percent. Optional, used in the W11 session.", "cue": "Build speed gradually, finish strong."}]}, {"id": "standard-dynamic-warm-up", "name": "Standard Dynamic Warm-Up", "kind": "dynamic-warm-up", "objective": "Prepare the body for the session with a self-run sequence the players already know.", "ages": ["u14"], "tracks": ["comp"], "dosage": "10 reps of each move, no ball. Self-run by the whole squad, about 8 minutes.", "equipment": "Cones to mark the working area. No ball.", "steps": [{"name": "Light Jog", "how": "Easy jog across the working area and back.", "cue": "Easy pace, stay relaxed."}, {"name": "Arm Circles", "how": "Circle both arms, small to large, forward then backward.", "cue": "Full range, loose shoulders."}, {"name": "Arms Alternating", "how": "Swing the arms across the body in alternating directions.", "cue": "Loose and rhythmic."}, {"name": "Body Twists", "how": "Stand tall and rotate the upper body side to side.", "cue": "Hips stay square, shoulders turn."}, {"name": "Knees Up", "how": "Drive the knees up toward the waist while moving forward.", "cue": "Knees to the waist, quick feet."}, {"name": "Heel Touches", "how": "Move forward kicking the heels up toward the backside.", "cue": "Heels to the backside, stay tall."}, {"name": "Open the Gates", "how": "Lift one knee and rotate it out to the side, like opening a gate, while moving forward. Alternate legs.", "cue": "Knee up and out, hips open."}, {"name": "Close the Gates", "how": "Lift one knee out to the side and rotate it back in across the body, like closing a gate. Alternate legs.", "cue": "Knee out and across, hips close."}, {"name": "Kick Out Sideways", "how": "Step and kick one leg out to the side, alternating legs.", "cue": "Stay balanced, controlled kick."}, {"name": "Kick Out Diagonally", "how": "Step and kick one leg out diagonally across the body, alternating legs.", "cue": "Stay balanced, controlled kick."}]}, {"id": "the-foundation", "name": "The Foundation", "kind": "ball-mastery", "objective": "A daily ball mastery sequence each player does alone before group training. Ten moves, 20 reps of each, working in place.", "ages": ["u12", "u14"], "tracks": ["comp"], "dosage": "20 reps of each move, every session", "equipment": "1 ball per player", "steps": [{"name": "Toe Taps", "how": "Alternate light taps on top of the ball with each foot, staying on your toes.", "cue": "Light contact, fast feet, ball barely moves."}, {"name": "Foundations", "how": "Tap the ball back and forth between the insides of your feet with short, controlled touches.", "cue": "Stay light, keep a steady rhythm, keep the ball close."}, {"name": "Sole Rolls", "how": "Put one sole on the ball and roll it sideways to the other foot, which receives it and rolls it back.", "cue": "Balanced weight, smooth touches."}, {"name": "V-Pulls", "how": "Pull the ball back with the sole, then push it diagonally forward with the inside of the same foot so it travels to the other foot in a V. That foot returns it the same way.", "cue": "Sole pulls back, inside pushes the V forward."}, {"name": "V-Pulls: Laces", "how": "Same pattern as V-Pulls, but push forward with the laces instead of the inside.", "cue": "Sole pulls back, laces push the V forward."}, {"name": "La Croqueta", "how": "Push the ball sideways with the inside of one foot and shift your whole body weight with it. The other foot receives it and pushes it back with another full weight shift.", "cue": "Full weight shift. The body moves with the ball, not just the feet."}, {"name": "Push Pull Laces", "how": "Push forward with the laces, then pull back with the sole on the same foot. Keep touches short. Switch feet after your reps.", "cue": "Laces push, sole pulls, stay balanced."}, {"name": "Push Pull Insides", "how": "Push across with the inside, then pull back with the sole on the same foot. Switch feet after your reps.", "cue": "Inside pushes across, sole pulls back, stay light."}, {"name": "Inside Outs", "how": "Push the ball outside with the outside of your right foot, step over it, then push it back to center with the right inside. Repeat on the left. The step-over is part of the move.", "cue": "Outside push, step over, inside back, other side. Keep the rhythm continuous."}, {"name": "Elastico", "how": "Push the ball outside with the outside of one foot, then flick it back inside with the inside of the same foot. Both touches are nearly simultaneous. Go slow until the touches are clean, then speed up.", "cue": "Outside push, instant inside snap, one fluid move."}], "source": "The Foundation"}], "routine_kinds": [{"id": "ball-mastery", "label": "Ball mastery"}, {"id": "dynamic-warm-up", "label": "Dynamic warm-up"}], "credit": {"author": "Coach Justin Whitaker"}, "updated": "Nov 19, 2026"};
const KEY = 'coachplanner.v1' + (DATA.area === 'comp' ? '.comp' : '');

const SPACE_LABEL = {quarter: '1/4 field', half: '1/2 field', full: 'Full field'};
let state = load();
if(state.space && !SPACE[state.space]) state.space = 'half';
let route = '';
try { route = location.hash.slice(1); } catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = s => document.querySelector(s), app = $('#app');
const acts = Object.fromEntries(DATA.activities.map(a => [a.id, a]));
if(state.players && !state.team) state.team = 'u10-rec';

let T = teamOf(state.team), plan = T.plan;
function setTeam(id){ T = teamOf(id); plan = T.plan; state.team = T.id; }

      <details class="swap"><summary>${alts.length ? 'Swap · ' + alts.length + ' fit your numbers and space' : 'Swap · none fit yet'}</summary>${alts.map(x => `<div class="alt"><span>${x.name}</span><button class="small" data-k="${key}" data-id="${x.id}">Use</button></div>`).join('') || '<p class="note">Nothing else fits. Try a different space in Setup.</p>'}
      ${swapped ? `<button class="small ghost" data-k="${key}" data-id="">${w.sessions[si][slot].activity ? 'Put the original back' : 'Clear my choice'}</button>` : ''}</details></div>`;
  }).join('') + '</div>');
  const sessions = sessionList.join('');
  const gs = P.great_session[(n-1) % P.great_session.length], cue = P.cues && P.cues[(n-1) % P.cues.length];
  const links = [n === 1 ? `<a href="#" data-nav="guide/parents">A word for parents</a>` : '', ...[...new Set(w.sessions.map((x, i) => sesBlock(w, i)))].map(b => `<a href="#" data-nav="why/${b}">Why this block: ${DATA.blocks[b].name}</a>`), `<a href="#" data-nav="guide">Coach guide</a>`].filter(Boolean).join('');
  const bits = `<section class="watch"><div class="lab">Watch for this week</div><div class="nm">${gs.title}</div><p>${gs.text}</p>${cue ? `<div class="stage"><b>${cue.when}</b>${cue.say}</div>` : ''}<div class="linkrow noprint">${links}</div></section>${(plan.standing || []).map(x => `<div class="card"><p><b>${x.title}</b><br>${x.text}</p></div>`).join('')}`;
  const tog = !one && sessionList.length > 1, cur = tog ? Math.min(prTab[n] || 0, sessionList.length - 1) : 0;
  const pblock = si => `<div class="pr${shape ? ' seq' : ''}${tog && si !== cur ? ' pr-off' : ''}" data-pr="${si}">` + (shape ? playCard(w, shape.opening, si) : '') + (si === 0 || tog ? routineCard(w) : '') + sessionList[si] + (shape ? gameCard(shape.closing, 'Closing game') : '') + '</div>';
  const body = (shape ? `<p class="lead">Every practice: play, practice, play.</p>` : '') + (tog ? `<div class="ptog noprint" role="tablist">${sessionList.map((_, i) => `<button type="button" data-pt="${i}" class="${i === cur ? 'on' : ''}">Day ${i + 1}</button>`).join('')}</div>` + sessionList.map((_, i) => pblock(i)).join('') : pblock(0));
  app.innerHTML = tabs(on) + strip + bn + `<h1>${w.focus}</h1>` + body + bits + `<div class="share noprint"><button id="shr">Share this week</button><button class="ghost" id="prt">Print</button></div>${helpLinks(n)}`;
  app.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { prTab[n] = +b.dataset.pt; app.querySelectorAll('[data-pt]').forEach(x => x.classList.toggle('on', x === b)); app.querySelectorAll('.pr').forEach(x => x.classList.toggle('pr-off', +x.dataset.pr !== +b.dataset.pt)); });
  $('#shr').onclick = () => shareWeek(n, $('#shr')); $('#prt').onclick = printWeek;
  const wk = k => { const [wn, si] = k.split('-'); return [plan.weeks.find(x => x.week === +wn), +si]; };
  const done = () => viewWeek(n);
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const [k, r] = b.dataset.add.split('|'); const [ww, si] = wk(k); setBuild(ww, si, buildOf(ww, si).concat({r})); buildUI[k].open = r.startsWith('own:') ? 'own' : 'lib'; done(); });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.rm.split('|'); const [ww, si] = wk(k), l = buildOf(ww, si).slice(); l.splice(+i, 1); setBuild(ww, si, l); done(); });
  app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.up.split('|'); const [ww, si] = wk(k), l = buildOf(ww, si).slice(), x = +i; [l[x - 1], l[x]] = [l[x], l[x - 1]]; setBuild(ww, si, l); done(); });
  app.querySelectorAll('[data-m]').forEach(inp => inp.onchange = () => { const [k, i] = inp.dataset.m.split('|'); const [ww, si] = wk(k), l = buildOf(ww, si).map(x => Object.assign({}, x)); const v = +inp.value; if(v > 0) l[+i].m = v; else delete l[+i].m; setBuild(ww, si, l); done(); });
  app.querySelectorAll('[data-any]').forEach(b => b.onclick = () => { const u = buildUI[b.dataset.any]; u.any = !u.any; u.open = 'lib'; done(); });
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [id, k] = b.dataset.edit.split('|'), o = state.own[id], f = app.querySelector(`[data-of="${k}"]`); f.querySelector('.o-name').value = o.name; f.querySelector('.o-notes').value = o.notes || ''; f.querySelector('.o-cue').value = o.cue || ''; f.querySelector('.o-ask').value = o.ask || ''; f.querySelector('.o-id').value = id; f.closest('details').open = true; f.scrollIntoView({block: 'center'}); });
  app.querySelectorAll('[data-saveown]').forEach(b => b.onclick = () => { const k = b.dataset.saveown, f = app.querySelector(`[data-of="${k}"]`), name = f.querySelector('.o-name').value.trim(); if(!name){ f.querySelector('.o-name').focus(); return; }
    state.own = state.own || {}; const eid = f.querySelector('.o-id').value, id = eid || 'o' + Date.now().toString(36); state.own[id] = {name, notes: f.querySelector('.o-notes').value.trim(), cue: f.querySelector('.o-cue').value.trim(), ask: f.querySelector('.o-ask').value.trim()};
    const [ww, si] = wk(k); if(!eid) setBuild(ww, si, buildOf(ww, si).concat({r: 'own:' + id})); else save(); buildUI[k].open = 'own'; done(); });
  app.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { state.swaps = state.swaps || {}; if(b.dataset.id) state.swaps[b.dataset.k] = b.dataset.id; else delete state.swaps[b.dataset.k]; save(); viewWeek(n); });
}
function viewWhy(b){
  const f = T.framework.blocks[b], areas = T.skills.filter(r => r.block === b && (T.track === 'comp' || r.level === 'intro')), comp = T.track === 'comp', names = comp ? [...new Set(areas.map(r => r.area))] : areas.map(r => r.area);
  const rest = n => { const m = f.focus.find(x => x.startsWith(n)); const r = m ? m.slice(n.length).replace(/^:\s*/, '') : ''; return r.charAt(0).toUpperCase() + r.slice(1); };
  const fold = !comp && f.focus.length === names.length && names.every(n => f.focus.some(x => x.startsWith(n)));
  const body = (n, inner) => names.length > 3 ? `<details class="card sk"><summary>${n}</summary>${inner}</details>` : `<div class="card sk"><b>${n}</b>${inner}</div>`;
  const ul = bl => `<ul>${bl.map(x => `<li>${x}</li>`).join('')}</ul>`;
  const looks = comp ? names.map(n => body(n, ['intro', 'dev', 'app'].map(lv => areas.filter(r => r.area === n && r.level === lv).map(r => `<div class="lbl">${LVL[lv]}</div>${ul(r.bullets)}`).join('')).join(''))).join('') : areas.map(r => body(r.area, (fold && rest(r.area) ? `<p class="note">${rest(r.area)}</p>` : '') + ul(r.bullets))).join('');
  app.innerHTML = `${whyFrom.startsWith('onb/') ? `<a class="back" href="#" data-nav="${whyFrom}">&larr; Back to the tour</a>` : '<a class="back" href="#" data-nav="guide/goals">&larr; Player goals</a>'}<div class="whyhd" style="--bc:${BCOL(b)}"><div class="why-eb">Why it matters</div><h1>${DATA.blocks[b].name}</h1></div><p class="tagline" style="--bc:${BCOL(b)}">${f.tagline}</p>
  <div class="idea${f.problem.length > 180 ? ' long' : ''}" style="--bc:${BCOL(b)}"><span>${comp ? 'The game problem' : 'The big idea'}</span>${f.problem}</div>
  <div class="card"><div class="lbl">About this block</div><p>${f.overview}</p></div>
  ${fold ? `<h2>Core focus and what to look for</h2>${looks}` : `<h2>Core focus</h2><div class="card focus" style="--bc:${BCOL(b)}">${ul(f.focus)}</div><h2>What to look for</h2>${looks}`}`;
}
function foot(h){
  const el = $('#foot'); if(!el) return; if(h.startsWith('onb/')){ el.innerHTML = ''; return; }
  const H = DATA.help || {}, C = DATA.credit || {};
  el.innerHTML = (H.email ? `<div><a href="mailto:${H.email}?subject=${encodeURIComponent('Coach help: ' + T.label + ' ' + T.track)}">Ask for help</a></div>` : '') + (C.author ? `<div>Designed by ${C.author}</div>` : '') + (DATA.updated ? `<div class="u">Updated ${DATA.updated}</div>` : '');
}
function render(){
  let h = route || (!state.players ? 'welcome' : needTour() ? 'onb/1' : 'now');
  if(!state.players && h !== 'setup' && h !== 'welcome'){ route = 'welcome'; return render(); }
  if(h === 'welcome') viewWelcome(); else if(h === 'setup') viewSetup(); else if(h === 'now') viewWeek(curWeek()); else if(h === 'goals') viewGuide('goals'); else if(h === 'guide') viewGuide(); else if(h.startsWith('guide/')) viewGuide(h.split('/')[1]); else if(h.startsWith('onb/')) viewTour(+h.split('/')[1]); else if(h === 'more') viewMore(); else if(h === 'library') viewLibrary(); else if(h === 'goals') viewGoals(); else if(h.startsWith('week/')) viewWeek(Math.max(1, Math.min(plan.weeks.length, +h.split('/')[1]))); else if(h.startsWith('why/')) viewWhy(h.split('/')[1]); else viewPlan();
  { const hs = document.querySelector('header small'); if(hs){ if(!hs.dataset.base) hs.dataset.base = hs.textContent; hs.textContent = state.players ? hs.dataset.base.replace(' · prototype', ' · ' + T.label + ' · prototype') : hs.dataset.base; } }
  foot(h); window.scrollTo(0,0);
}
render();
