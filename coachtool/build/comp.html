ors", "setup": ["Two teams of 3 to 4.", "A field about 20 by 30 yards.", "Two Pugg goals on each end line."], "rules": "No touch limits.", "coach": [{"cue": "Scan before you receive.", "ask": "Before receiving, which Pugg is open?"}, {"cue": "Look for a teammate before the ball arrives.", "ask": "Did you see your teammate before or after the ball arrived?"}], "coach_note": "Observe who looks for a teammate before receiving and who carries. This becomes the coaching point in the wall pass activity.", "type": "small-sided", "objective": "Get moving while demanding scanning before receiving. The tight field makes a wall pass faster than a dribble."}, {"id": "wall-pass-grid", "order": 51, "name": "Wall Pass Grid", "block": "B2", "skills": ["Passing", "Controlling", "Combination Play"], "ages": ["u12", "u14"], "tracks": ["rec", "comp"], "levels": ["intro"], "players": {"min": 10, "max": 12}, "space": "quarter", "minutes": 20, "pairs_with": ["two-pugg-ssg", "1v1-two-active-wide-outlets-gk"], "equipment": "Balls · Cones · 1 mannequin", "setup": ["Two lines run at the same time, with a mannequin in the center.", "5 reps per set, 3 sets. Wall players swap between sets.", "Drive from the line toward the mannequin, reading the timing of the player in the opposite line. Exit to the opposite line after each rep.", "Play a firm pass to the wall player's feet, with your body already opening toward the return.", "Take a first touch that moves forward into space. Drive through and exit."], "scoring": "None", "coach": [{"cue": "Open your body before you pass.", "ask": "Is your body opening before you pass?"}, {"cue": "Drive through, do not watch.", "ask": "What did you see from the other driver before you entered the grid?"}, {"cue": "First touch moves you forward.", "ask": "Does your first touch move you forward?"}, {"cue": "Wall players: call for the ball, show a target and set an angle that makes the return easy to play forward.", "ask": "Where did you stand to make the return easy?"}], "coach_note": "Wall players are practicing a skill too: setting their angle, giving a clear target, and timing the return.", "type": "pattern", "objective": "Install wall pass mechanics before adding defenders: the pass to the wall, the return and first touch, and the movement after."}, {"id": "1v1-two-active-wide-outlets-gk", "order": 52, "name": "1v1 + Two Active Wide Outlets + GK", "block": "B2", "skills": ["Combination Play", "Dribbling", "Decision-Making"], "ages": ["u12", "u14"], "tracks": ["rec", "comp"], "levels": ["intro"], "players": {"min": 5, "max": 6}, "space": "quarter", "minutes": 20, "pairs_with": ["wall-pass-grid", "3v3-2-wide-jokers-gk"], "equipment": "Balls · Cones · 1 full-size goal · 1 small goal", "setup": ["A 1v1 in the center with a live defender.", "Two active outlets wide. They check to create angles.", "A full-size goal with a goalkeeper. A small goal or Pugg is the second target.", "The coach feeds the ball. The central player reads where the outlets are checking."], "rules": ["Dribbling is available.", "After a combination, decide: finish directly or play across to the opposite outlet."], "coach": [{"cue": "Read where the wide outlets are checking and use the useful angle.", "ask": "Where are the wide outlets, and which angle is useful?"}, {"cue": "Same weight and surface as the wall pass, first touch forward.", "ask": "Did your first touch move you forward?"}, {"cue": "Do not dictate the choice. Combine or carry.", "ask": "What told you to combine or carry?"}], "coach_note": "Do not dictate the choice. Ask players what they saw that led them to combine or carry.", "type": "small-sided", "objective": "Apply the wall pass under live pressure. The central player chooses among three options: play right, play left, or beat the defender and shoot."}, {"id": "3v3-2-wide-jokers-gk", "order": 53, "name": "3v3 + 2 Wide Jokers + GK", "block": "B2", "skills": ["Combination Play", "Passing", "Decision-Making"], "ages": ["u12", "u14"], "tracks": ["rec", "comp"], "levels": ["intro"], "players": {"min": 9, "max": 10}, "space": "half", "minutes": 25, "pairs_with": ["1v1-two-active-wide-outlets-gk"], "equipment": "Balls · Cones · 1 full-size goal · 2 Pugg goals · Pinnies in 2 colors", "setup": ["A central 3v3, live.", "Two jokers in wide channels.", "The attacking end has a full-size goal with a goalkeeper. The counter end has 2 Pugg goals."], "rules": ["Jokers play for the attacking team only. One or two touches, wall pass return only. No carrying or shooting.", "Rotate the joker roles every few minutes.", "The coach feeds a new ball after each shot or turnover."], "scoring": ["The attacking team shoots on the full goal.", "The defending team counters to either Pugg goal at the opposite end."], "coach": [{"cue": "Central players, break the middle first and then use the joker.", "ask": "What opened the chance: the combination or the defender's mistake?"}, {"cue": "Jokers, set your angle early and give an easy target.", "ask": "Where did you set your angle?"}, {"cue": "Player who used the joker, move immediately.", "ask": "What did you do right after the pass?"}, {"cue": "When you win the ball, go to the counter Puggs.", "ask": "What did you see when you won it?"}], "coach_note": "The progression addresses midfielders abandoning central space. Use it only if the pattern appears.", "progression": [{"title": "Play through the middle first", "text": "If central players always go wide first, require play through the middle before a joker can be used. Use it only if the pattern appears."}], "type": "small-sided", "objective": "Break the middle first, then use the wide jokers for wall passes to create the chance."}, {"id": "square-passing", "order": 54, "name": "Square Passing", "block": "B2", "skills": ["Passing", "Body Shape", "Combination Play"], "ages": ["u14"], "tracks": ["comp"], "levels": ["app"], "players": {"min": 4, "max": 15}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones", "setup": ["One square per group of 5, about 8 by 8 yards. Corners are numbered 1 to 4: top left, top right, bottom right, bottom left.", "Four players on the corners. The fifth swaps in on a rotation so nobody regroups between variations."], "rules": ["Variation 1, back foot (about 2 min): the ball goes corner to corner around the square. Receive on the back foot and open the body before passing on.", "Variation 2, third man (about 3 min): 1 passes to 2. 2 lays it back to the midpoint between them, where 1 meets it and redirects to 3, not back to 2. Continue 3 to 4, then 4 to 1. The same two players never swap passes twice.", "Variation 3, one-two combo (about 3 min): a give-and-go on each edge. 1 to 2, 2 lays back to the midpoint, 1 plays it back out to the midpoint. Move to the next edge, using that corner as the new start, until the loop closes.", "Variation 4, diagonal (about 2 min): pass to the adjacent corner first, then diagonally across to the far corner. Time the runs so the paths do not collide."], "coach_note": "Time is a ceiling. Get through as many variations as the group can handle cleanly.", "coach": [{"cue": "Receive on the back foot with the body already open to the next target.", "ask": "Where is your body pointing when the ball arrives?"}, {"cue": "Weight the pass to the receiver's feet.", "ask": "Could your teammate play that first time? What would have made it easier?"}, {"cue": "The movement after the pass is part of the pass.", "ask": "After you pass, where are you going and why?"}, {"cue": "Call for it before the ball arrives. Do not receive in silence.", "ask": "What did you say, and when did you say it?"}], "diagram": "square-passing.jpg", "type": "pattern", "objective": "Pass and receive in a square with the body open to the next pass: back foot, third man, one-two and diagonal.", "diagram_caption": "Four squares, one per variation, with arrows showing the passing order for back foot, third man, one-two combo and diagonal.", "figs": [ comp"], "levels": ["dev"], "players": {"min": 4, "max": 8}, "space": "half", "minutes": 7, "pairs_with": [], "equipment": "Balls · Cones · Full-size goal and keeper", "setup": ["A full-size goal with a keeper and a coned target zone. A server with a pile of balls feeds the shooters in a line.", "Mix the feed: some tossed for pure volleys, some bounced to force half-volley timing."], "rules": ["First-time volleys and half-volleys only. No ground balls.", "Call a target corner on some reps and leave others open."], "coach": [{"cue": "Knee and hip height match the height of the ball at contact.", "ask": "What height was the ball when you struck it?"}, {"cue": "Short, controlled swing, not a full backswing.", "ask": "How big was your swing, and was it enough?"}, {"cue": "Watch the ball onto your foot through contact.", "ask": "Where were your eyes at contact?"}, {"cue": "Half-volley: strike just after the bounce, not at the peak.", "ask": "When did the ball bounce relative to your strike?"}], "type": "pattern", "objective": "Strike first-time volleys and half-volleys, with straight repetition and no game wrapped around it."}, {"id": "first-to-the-ball", "order": 60, "name": "First to the Ball", "block": "B5", "skills": ["Shooting", "Decision-Making"], "ages": ["u14"], "tracks": ["comp"], "levels": ["dev"], "players": {"min": 4, "max": 8}, "space": "half", "minutes": 7, "pairs_with": [], "equipment": "Balls · Cones · 2 flags · Full-size goal and keeper", "setup": ["A full-size goal with a keeper. Two lines on either side, with a flag marking each line's start. A loose ball in the middle. A second ball staged outside the grid.", "Both players go to the back of a line after the 1v1 resolves. Swap sides each rep so nobody races the same person."], "rules": ["1. The first player in each line sprints to the loose ball.", "2. The winner takes a touch and shoots.", "3. The loser peels off to the second ball and brings it forward.", "4. The winner recovers immediately to defend. , 9, 10) rotate through the attacking 3.", "Wingers (7, 11) and their fullbacks (2, 3) work the wide lanes, alternating which side goes live each rep. A coach stands in each wide lane as a passive defender.", "Two small goals at the base of the box for the defenders to counter into.", "Rotate one attacker out of the 3 every rep. A second ball goes in right after a miss or a save. The reset is the rep."], "rules": ["The line-break has to be a pass. No dribbling past 4 and 5.", "After the pass breaks the line, the runner takes a one-touch shot. On the same trigger the winger on that side drives at the coach.", "After the shot, the shooter gets back level with 4 and 5, onside, then follows the winger's ball in."], "scoring": ["Attack: 1 point for a pass that breaks the line, scored or not. 1 point for a shot that scores.", "Defense: 1 point for winning the ball and scoring into a small goal."], "coach_note": "Alternate sides each rep so both wingers and both fullbacks get even reps.", "coach": [{"cue": "Can you split the defense with a grounded ball into the gap for a runner in behind?", "ask": "What gap did you see?"}, {"cue": "Receive back to goal, lay it off to a teammate facing goal and get played in yourself.", "ask": "Who was facing goal when you laid it off?"}, {"cue": "If 4 and 5 get pulled to one side, switch the point to the runner on the far side.", "ask": "What pulled the defense to one side?"}, {"cue": "Winger: pushed outside, get ready to cross. Pushed inside, run in for the shot.", "ask": "Which way did the coach push you, and what did you do?"}, {"cue": "Shooter: get back onside before you do anything else, then follow the next ball in.", "ask": "What did you do right after your shot?"}], "progression": [{"title": "Set 1, defenders hold", "text": "4 and 5 stay outside the box after the pass. The winger drives solo at the coach."}, {"title": "Set 2, defenders chase", "text": "4 and 5 release and chase the moment the line-breaking pass is played. The keeper can come off the line. Winger and fullback work as a pair: the driver fixes the coach, the partner overlaps."}], "diagram": "3v2-line-break-and-wide-finish.png", "type": "small-sided", "objective": "Break the line with a pass, then finish twice off one sequence: the runner shoots and the winger drives the wide lane.", "diagram_caption": "Three attackers play against two defenders at the top of the box. The winger drives the wide lane against a passive coach. Small goals sit at the base of the box.", "figs": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAIcCAYAAADffZlTAAAKsGlDQ1BJQ0MgUHJvZmlsZQAAeJyVlwdQU+kWx8+96SGhJSAgJfQmSCeAlBBaKNKrqIQkhECIMQRUxM7iCq4FFRGs6KqIgpVmx4KFRbBhXxBRUZ6LBRsqb4Ah7O5r887Mvd9vzj33f8755n4z5wJQdblSqRhVBciSyGVRgb6MhMQkBuEV4EEPAEjA5PKypayIiFAAgPH1r/bxLiAj6y2bEa1/ff5fTY0vyOYBIBEAkMrP5mUBIMcBkI88qUwOgDkIAMbz5NIRbgcAuiwhMQkA82yEhWP8eYRTRxlLGY2JiWIDYBkARAqXKxMCUKYAACOXJ5QDUEZ6sJPwRRIASj4AeGVlzeEDUE4BgEUuTygFoIzoM1P/pCP8i2aqQpPLFSp4rJdRI/qJsqVi7oL/czv+t2WJc8ZzmAMAJV0WFDWSDwB5ljknRMGS1Onh4yzij9U0wuk5QbHjzMtmJ41ztjiaM858rl+IQkc8PXSc00QBihiRnBMzzoJs/+hxls2JUuRNk7FZ48yVjdZABkD6czJjFf50AUehn5ceEz/OuaK46YraMqNDJmLYCr8sJ0rRi0AS6DuRN0CxD1nZf+pdxFG8K0+PCVLsA3eifoGENaGZnaCojS/w85+IiVXES+W+ilxScYQiXiAOVPizc6MV78plMRPx8gjFHmZwgyPGGUQQBlzgMVTGCUAumC8faYQ9R7pAJhKmyxksqVQsYHAkPNspDAc7BxeAkbM79mm8jxw9k4hm64Rvxe8AnmeHh4dPTviCzwIccQUgN074LJgAakoAVxp5ObLcMR925IYDMqgAHbRBH4zBAmzAAVzAA3zAH4IhHGIgEWYBD9IhC2QwD/JhGRRCMayDTVAOO2A37IdDcBTq4RSch8twHdrhDjyELuiF1zAAH2EIQRACQkVoiDZigJgi1ogDwkS8EH8kFIlCEpEURIhIkBwkH1mBFCMlSDmyC6lCjiCNyHnkKtKB3Ee6kT7kHfIVxaAUlI7qoWboVJSJstAQNAadiQrRuWgeWoCuQcvQSvQgWoeeR6+jd9Au9DU6iAGMEkYTY4ixwTAxbEw4JgmThpFhFmOKMKWYSkwNpgnTgrmF6cL0Y75g8VgaloG1wXpgg7CxWB52LnYxdjW2HLsfW4e9iL2F7cYOYH/gqDhdnDXOHcfBJeCEuHm4Qlwpbi/uBO4S7g6uF/cRj8dr4s3xrvggfCI+A78Qvxq/DV+LP4fvwPfgBwkEgjbBmuBJCCdwCXJCIWEL4SDhLOEmoZfwmahENCA6EAOISUQJcTmxlHiAeIZ4k/iCOERSJZmS3EnhJD5pAWktaQ+piXSD1EsaIquRzcme5BhyBnkZuYxcQ75EfkR+r6SkZKTkphSpJFJaqlSmdFjpilK30heKOsWKwqYkU3Ioayj7 , play the late runner or recycle.", "diagram_caption": "The no-defense pattern: 11 plays to 8, 8 switches to 6, and 6 plays to 7 to finish.", "figs": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAIcCAYAAADffZlTAABsuElEQVR42u3ddXjV5ePG8fvEumDE6BgxSmBII0iXhJSUoljAyEl3d4cDDBBFQUBKuqRBuqVjwIAxYGO9nfj9gfL7qqCoAxbv13V5Oc62s7P7c+I+z57P8xjsdvslSb4CAAAA8LeMRAAAAABQoAEAAAAKNAAAAECBBgAAACjQAAAAAAUaAAAAoEATAQAAAECBBgAAACjQAAAAAAUaAAAAoEADAAAAFGgAAACAAk0EAAAAAAUaAAAAoEADAAAAFGgAAACAAg0AAABQoAEAAAAKNBEAAAAAFGgAAADguTATAYC0yG63E8JzYjAYCAEABRoAUouvF3wlDw8PZfHJIpvdRiDPoTzHRMfo9OnT6hgQICcnJ0IBQIEGgJQsPDxCFSpWUr58+QjjOYmJidGmTZsUFRlJgQZAgQaAlCwxMVFurq7KlCmTjEZOAXleXFxc5J0hgxISEwkDgDiJEABSsPj4eEVFR8lkMhHGc2Sz2WT49f8AQIEGgBQsNjZWZrOD3NzcCOM5MplMyp4juxITEggDAAUaAFIyS2KijEYj0zee9wuL0ShHRydFRkYSBgAKNAAohS9d5+7uThAvgIeHBwUaAAUaAFK6+IQERp9fEGdnZ0VFRREEAAo0AKRkcbGxMps5gfBF8PT0ZEMVAGIZOwBIwR48CNeBAwd06dIlHT9+nJ0I9Xw3Uzl77pzu37unwkWKKEeOHIQCIHU9z9nt9kuSfIkCQGq2ceNGXbx4UZkzZ5ZkkESBft4ePnwoo9Go9u3bEwYAMQINAEp5K0MUKlRI2bJlk81mYy60nvM60AaDIiMjde1aMIEAoEADQEplsVhksVhks9kUFhamBNYpfi5vVDJlyiQHBwdZLBamygCgQANAaih4Dx8+1PHjJ1SiRHE9ms4BJcncZ+nUqdOyWCzKkycPgQCgQAOAUtFItK9vXtWoUYMwkpiLi6vu3QsjCABiGTsAUOqbp4vn8+YEACjQAAAAACjQAAAAAAUaAAAAoEADAAAAFGgAAACAAg0AAABQoAEAAABQoAEAAAAKNAAAAECBBgAAACjQAAAAAAUaAAAAoEADAAAAoEADAAAAFGgAAACAAg0AAABQoAEAAAAKNAAAAECBBgAAAECBBpC2mUwmQngOzGYzIQBI/c91RAAgLZbnkydPKn369IqNiVFCQoK80qVTTEyMEhMT5enhofj4eMXHx8vD01MJv37s6en5+HJ3Dw9ZLBbFxcbKw8NDiYmJiouLk7u7u6w2m2JjYuTm7iabzf7rx+6y/Xq5q6urDAaDoqOj5erqKhkMivn1498ud3FxkclkVlRUpNKlT6/Ihw9lMpvl7OSkhw8fysnJSY5OTor89WOnXy93cHSUq6uLIiIeytHBQc4uLo8uN5vl6uamiIgImc1muT3hY5PJJE8PDz0ID5fZZJK7h4ciIiJkNBrl4eGhiPBwGYxGeXl6KjwiQkaDQR6enoqIiJDBYFC6dOm0f99++RUqxJ0MAAUaAFJbgb565YriY2NlsVhks9vkYHaQ1WqVzW6T2WyWzWaTzfbXH9ttdllt1t9dbjKZJfuvl5vMsssuq9X66PLHHz8a/f7Lj40mGQwGWawWOTg4yJJokcFokMloUqIlUUajUUajURaL5fcfG4wymX79mv/52GAwyGwyP/ljs1mJiYkyyCCzw68fP+3yP35s/vV6ZJCjk6OuX7+hQoULyWAwcEcDQIEGgNQiMTFRlatUUZ06dR5fZrfbH5c+u90uGQwyJMXHMshg+OPHkvTo5 ": "half", "minutes": 15, "pairs_with": [], "equipment": "Balls · Cones · Full-size goal and keeper", "setup": ["Two setups at the edge of the box, one on each side, both shooting at the same goal. Keeper in goal.", "Each side has a passer with a ball, an attacker and a dummy, plus a line of 3 or 4 waiting. The dummy stays behind the cones, passive, and does not tackle.", "Rotation: 1 passes, then becomes the dummy (2). 2 becomes the attacker (3). 3 finishes, then goes to the back of the line. The next in line becomes 1."], "rules": ["The passer does not call the speed. Players read it.", "Light pass: keep stepping in, take it, finish.", "Really hard pass: take a touch first, then finish.", "In between: check back out, follow the ball and take a one-touch shot.", "Look up and make sure the keeper is set before shooting.", "Walk it first (2 min). First side 6 min. Switch sides (1 min). Second side 6 min."], "coach": [{"cue": "Play it through. Work with whatever the pass ends up being.", "ask": "What did the pass weight tell you to do?"}, {"cue": "Make the turn a step and a pop.", "ask": "When did you take your step: when the ball was close enough?"}, {"cue": "Do not take the shooting step until you know you are on the ball.", "ask": "How did you know the ball was yours?"}, {"cue": "If the pass is really hard, take a touch.", "ask": "How did you know it was too hard to step into?"}, {"cue": "Speak up and talk to your teammate.", "ask": "What did you say to the passer?"}], "diagram": "check-in-check-away-finish.png", "type": "pattern", "objective": "Read the weight of the pass: step in if it is light, take a touch if it is hard, otherwise check away, follow the ball and shoot first time.", "diagram_caption": "Two mirrored setups at the edge of the box shooting at one goal. The solid arrow is the pass and the dashed arrows are the attacker's check in and check away.", "figs": [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsAAAALQCAMAAACpJzZGAAAKsGlDQ1BJQ0MgUHJ ock": "B4", "skills": ["Controlling", "Passing", "Restarts"], "ages": ["u14"], "tracks": ["comp"], "levels": ["dev"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 6, "pairs_with": [], "equipment": "Balls · Cones", "setup": ["Two facing lines per grid, 3 or more grids. A thrower and a target.", "Continuous shuttle across the grid."], "rules": ["The thrower throws to the target's chest. The target chests it down in one touch and passes back.", "The thrower dribbles the full width to the opposite line and passes to the first player there.", "That player throws the ball back in to the thrower, who chests it down, passes back and joins the back of the line.", "Both feet down, equal release on the throw."], "coach_note": "A technical install, not a fitness rep. Slow the group down if technique breaks under speed.", "coach": [{"cue": "Both feet down, equal release on the throw. No cheating the technique.", "ask": "Where were your feet at release?"}, {"cue": "Chest control absorbs the ball. It does not fight it.", "ask": "What did your chest do on contact?"}, {"cue": "Every touch has a purpose. No standing over the ball.", "ask": "What was your next action before the ball arrived?"}], "type": "set-piece", "objective": "Control a short throw-in with the chest in one touch, play it back and keep the shuttle going."}, {"id": "throw-in-check-and-run", "order": 72, "name": "Throw-In Check and Run", "block": "B4", "skills": ["Scanning", "Driving", "Restarts"], "ages": ["u14"], "tracks": ["comp"], "levels": ["dev"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 6, "pairs_with": [], "equipment": "Balls · Cones", "setup": ["Two facing lines per grid, 3 or more grids, same as the chest control shuttle.", "Target and thrower. The thrower steps into the target's spot after each rep, ready to make the same run next."], "rules": ["The target checks in toward the thrower, then breaks away on a run while the ball is thrown long, over the shoulder, timed to the run.", "The target collects, drives and passes across to the front of the opposite line."], "coach": [{"cue": "Check your shoulder before the long throw arrives so the turn is already decided.", "ask": "Which way did you decide to turn, and when?"}, {"cue": "Both feet down, equal release on the throw.", "ask": "Was the throw the same weight each time, and could the runner time it?"}, {"cue": "Every touch has a purpose.", "ask": "What did you do with your first touch?"}], "type": "set-piece", "objective": "Check toward the thrower, then break on a run for a long throw timed over the shoulder, and drive it away."}, {"id": "corner-the-loop", "order": 73, "name": "Corner: The Loop", "block": "B4", "skills": ["Supporting", "Shooting", "Restarts"], "ages": ["u14"], "tracks": ["comp"], "levels": ["dev"], "players": {"min": 6, "max": 11}, "space": "half", "minutes": 5, "pairs_with": [], "equipment": "Balls · Cones · Full-size goal and keeper · Corner flag or marker cone", "setup": ["Walk-through with no opposition. A corner taker, a target runner and three decoys.", "The target starts closest to the ball among the runners. The three decoys cluster between the target and the back post."], "rules": ["As the taker steps to strike, the target spins away from the ball and loops around the outside of the cluster to arrive free at the back post.", "The decoys peel off toward the near post and the center of goal."], "coach_note": "Assign roles by who you have. The target wants good spatial timing more than pure speed. Defending is secondary today: full man-marking, every attacker has a defender assigned before the serve, called out loud, with the keeper organizing.", "coach": [{"cue": "Go last, arrive first. Let your teammates clear the path before you spin.", "ask": "When did you spin, and what had cleared?"}, {"cue": "Defenders: know your mark before the serve.", "ask": "Who was your mark?"}], "diagram": "corner-the-loop.jpg", "type": "set-piece", "objective": "A target e when you decided?"}, {"cue": "Does rushing this gain us anything right now?", "ask": "What did the rush gain or cost you?"}], "type": "set-piece", "objective": "Replace the automatic long boot with a read: play it quick while the opponent is scattered, slow it down when the game state calls for it."}, {"id": "3v3-four-goals", "order": 101, "name": "3v3 Four Goals", "block": "B1", "skills": ["Scanning", "Controlling", "Decision-Making"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Two mini goals on each end line, about 6 yards apart. Each team defends the two goals on its end and attacks the two on the other. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Have the team that is waiting stand behind one end line and count goals out loud."], "rules": ["The challenge: two goals to attack and two to defend, so you have to look to find the open one.", "Kick in from the sideline to restart. No offside.", "After a goal, the other team starts with the ball from their end line."], "scoring": "One point for a goal in either goal. First team to 3, then rotate teams.", "coach": [{"cue": "Look before the ball arrives.", "ask": "Which goal was open, and how did you know?"}, {"cue": "Shoot at the goal the defender is not covering.", "ask": "Where was the defender when you picked your goal?"}, {"cue": "Take your first touch toward the open goal.", "ask": "Which way did your first touch take you, and why?"}], "type": "opening-play", "objective": "Look up before you shoot. With two goals to attack and two to defend, the player who scans finds the open goal.", "progression": [{"title": "Easier", "text": "Make the goals wider so the open goal is easy to see."}, {"title": "Harder", "text": "Use three goals per end, or add a second ball to the game."}]}, {"id": "3v3-beat-your-player-bonus", "order": 102, "name": "3v3 Beat Your Player Bonus", "block": "B1", "skills": ["Dribbling", "Decision-Making"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Ask a waiting player to call out when a dribble beats a defender, so the bonus is clear."], "rules": ["The challenge: go past a defender, then score.", "If a player dribbles past a defender and scores within about five seconds, the goal counts double. The other team and the sideline can call it.", "Passing is always allowed. The bonus is a reward, not a rule.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. A goal right after beating a defender is 2. First team to 5.", "coach": [{"cue": "Take on the defender when you have space and your teammates are covered.", "ask": "What made you decide to dribble instead of pass?"}, {"cue": "Change speed after you beat the defender.", "ask": "What did you do right after you got past?"}, {"cue": "Passed instead? Good, if it was the better choice.", "ask": "When is passing better than taking them on?"}], "type": "opening-play", "objective": "Take on a defender when the chance is there. A goal after beating your player is worth double.", "progression": [{"title": "Easier", "text": "Give the dribbler a free first touch, with no defender pressure until they have taken two touches."}, {"title": "Harder", "text": "Only count the bonus if the dribbler beats the defender on the outside, away from the goal."}]}, {"id": "4v4-open-space-drive", "order": 103, "name": "4v4 Open Space Drive", "block": "B1", "skills": ["Driving", "Scanning", "Decision-Making"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mark a halfway line with cones. Mini goals or cone goals at each end. No goalkeepers.", "4v4. Extra players wait on the sideline and rotate in after each goal.", "Put a cone in the middle of the halfway line so it is easy to see."], "rules": ["The challenge: open grass ahead of you, so drive the ball into it.", "When a team has the ball in its own half, the other team must stay behind the halfway line.", "Once the ball crosses the halfway line, everyone can play.", "If the ball goes out, restart with a kick-in. The team that did not touch it last gets the ball."], "scoring": "One point per goal. First team to 4.", "coach": [{"cue": "Take your first touch into the space, not away from it.", "ask": "Where did you see the space, and when?"}, {"cue": "Look up as you drive.", "ask": "What did you see when you lifted your head?"}, {"cue": "Slow down, or pass, when the defense catches up.", "ask": "What told you to stop driving?"}], "type": "opening-play", "objective": "Spot the open grass ahead of you and drive the ball into it. The other team has to stay back until you cross halfway.", "progression": [{"title": "Easier", "text": "Make the field a little wider so the open space is bigger."}, {"title": "Harder", "text": "The defense can step over the halfway line once the ball carrier has taken three touches."}]}, {"id": "3v3-protect-it-for-three", "order": 104, "name": "3v3 Protect It for Three", "block": "B1", "skills": ["Protecting", "Controlling", "Body Shape"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Choose one waiting player to count out loud when a team wins the ball."], "rules": ["The challenge: when you win the ball, keep it.", "When a team wins the ball, the coach or a sideline player counts out loud. Keep it for three seconds and the team gets a bonus point.", "You can protect by shielding it yourself or passing it to a teammate who is free.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. Keeping the ball for three seconds after winning it is 1 point. First team to 5.", "coach": [{"cue": "Get your body between the ball and the defender.", "ask": "Which side was the defender on, and where did you put your body?"}, {"cue": "Keep the ball on the foot farthest from the defender.", "ask": "Which foot did you use, and why?"}, {"cue": "Look for a free teammate.", "ask": "Who was free when you had the ball?"}], "type": "opening-play", "objective": "Win the ball and keep it. Put your body between the ball and the defender and protect it for three seconds.", "progression": [{"title": "Easier", "text": "Count to two instead of three."}, {"title": "Harder", "text": "Count to five, or the defender is allowed to challenge from the first touch."}]}, {"id": "3v3-everybody-plays", "order": 105, "name": "3v3 Everybody Plays", "block": "B2", "skills": ["Passing", "Supporting", "Combination Play"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Have each team count its touches out loud, one, two, three, so everyone knows who has played."], "rules": ["The challenge: all three teammates touch the ball before a goal counts.", "If a team scores without all three touching it, the goal does not count and the other team gets the ball.", "Kick in from the sideline to restart. No offside."], "scoring": "One point per goal that counts. First team to 4.", "coach": [{"cue": "Show for the ball. Be somewhere your teammate can see you.", "ask": "How did you let your teammate know you were free?"}, {"cue": "After you pass, move to a new spot.", "ask": "Where did you go after your pass?"}, {"cue": "Find the teammate who has not touched it yet.", "ask": "Who had not touched the ball, and how did you get it to them?"}], "type": "opening-play", "objective": "Get everyone involved. A goal only counts once all three teammates have touched the ball.", "progression": [{"title": "Easier", "text": "Only two different players need to touch the ball."}, {"title": "Harder", "text": "A pass has to be one or two touches, and the goal counts only if the last pass is a first-time pass."}]}, {"id": "4v4-pass-and-move", "order": 106, "name": "4v4 Pass and Move", "block": "B2", "skills": ["Passing", "Supporting", "Communication"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "4v4. Extra players wait on the sideline and rotate in after each goal.", "Stand on the sideline so you can see every player after a pass."], "rules": ["The challenge: after you pass, you move.", "Any player the coach sees standing still after a pass costs the team the ball. Call it out and give the ball to the other team.", "Everyone can play. No other rules.", "Kick in from the sideline to restart."], "scoring": "One point per goal. First team to 4.", "coach": [{"cue": "Pass, then go. Move to a space your teammate can pass to.", "ask": "Where did you move after your pass, and why there?"}, {"cue": "Tell your teammate where you are going.", "ask": "What did you tell your teammate before the pass?"}, {"cue": "Move to the side of the defender, not behind them.", "ask": "Where were you when your teammate looked up?"}], "type": "opening-play", "objective": "Pass, then move. Players who stand still after a pass give the ball away.", "progression": [{"title": "Easier", "text": "Call the freeze only after a second still moment."}, {"title": "Harder", "text": "After a pass, the passer has to move before the next pass can be played."}]}, {"id": "5v4-with-a-floater", "order": 107, "name": "5v4 With a Floater", "block": "B2", "skills": ["Numerical Advantage", "Passing", "Possession"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "Two teams of four, plus one floater who plays for whichever team has the ball.", "Extra players wait on the sideline and rotate in after each goal.", "Give the floater a different color pinnie from both teams."], "rules": ["The challenge: the team with the ball always has an extra player.", "The floater switches teams the moment the ball changes hands. They cannot score.", "Kick in from the sideline to restart.", "If the defending team wins the ball, the floater joins them straight away."], "scoring": "One point per goal by one of the four. The floater cannot score. First team to 4.", "coach": [{"cue": "Use the floater when you are under pressure.", "ask": "When was the floater free, and did you find them?"}, {"cue": "Move into a spot where the defense cannot see you and the ball.", "ask": "Where were you when you got the ball?"}, {"cue": "Look for the free player before you pass.", "ask": "Who was free, and how did you see that?"}], "type": "opening-play", "objective": "Use the extra player. The team with the ball always has five, so keep the ball moving and find the free player.", "progression": [{"title": "Easier", "text": "The floater can score."}, {"title": "Harder", "text": "The floater can only play two touches."}]}, {"id": "3v3-give-and-go-bonus", "order": 108, "name": "3v3 Give and Go Bonus", "block": "B2", "skills": ["Combination Play", "Passing", "Supporting"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Show the give and go once with two players before you start, then let them play."], "rules": ["The challenge: pass it, run past the defender, get it back.", "A goal scored right after a give and go counts double. A give and go is a pass to a teammate and a return pass to the first player after they run into new space.", "Anyone can call the bonus. If it is not clear, the coach decides.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. A goal after a give and go is 2. First team to 5.", "coach": [{"cue": "Pass, then run past the defender.", "ask": "Where did you run after you passed it?"}, {"cue": "Return the ball into space ahead of your teammate.", "ask": "Where did you want the ball to go?"}, {"cue": "Pass, then go. Do not stand still.", "ask": "How did you get free to receive the ball back?"}], "type": "opening-play", "objective": "Pass and run into space to get it back. A goal after a give and go is worth double.", "progression": [{"title": "Easier", "text": "Any two passes between the same two players count as a give and go."}, {"title": "Harder", "text": "The return pass has to be a first-time pass."}]}, {"id": "4v4-use-the-width", "order": 109, "name": "4v4 Use the Width", "block": "B2", "skills": ["Passing", "Supporting", "Possession"], "ages": ["u8", "u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Use cones to mark a narrow lane along each sideline, about 5 yards wide. Mini goals or cone goals at each end. No goalkeepers.", "4v4. Extra players wait on the sideline and rotate in after each goal.", "Walk the lanes once so players know where they are."], "rules": ["The challenge: a goal only counts after the ball touches a teammate standing in a side lane.", "One player from the team in possession can stand in a lane. The other team cannot enter the lane.", "The ball can be passed to the lane player and back, or the lane player can play it onward.", "Kick in from the sideline to restart."], "scoring": "One point per goal that counts. First team to 4.", "coach": [{"cue": "Spread out. Make the field big when you have the ball.", "ask": "Where did you stand to give your teammate space?"}, {"cue": "The wide player waits for the ball, then plays it back to the middle.", "ask": "What did you see before you passed?"}, {"cue": "Go the long way if the short way is blocked.", "ask": "Why did you play it wide instead of through the middle?"}], "type": "opening-play", "objective": "Spread out to open the field. The ball has to touch a player on the wing before a goal can count.", "progression": [{"title": "Easier", "text": "The lane player can score from the lane."}, {"title": "Harder", "text": "Make the lane narrower, or a goal counts only after the ball goes from one lane to the other."}]}, {"id": "4v4-two-in-the-final-third", "order": 110, "name": "4v4 Two in the Final Third", "block": "B3", "skills": ["Compact Shape", "Pressing", "Numerical Advantage"], "ages": ["u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Use cones to mark the final third at each end, about a third of the field. Mini goals or cone goals at each end. No goalkeepers.", "4v4. Extra players wait on the sideline and rotate in after each goal.", "Walk the final-third lines once so players see where the limit is."], "rules": ["The challenge: attackers can only send two players into the final third. The other two have to stay behind it.", "If a third attacker enters the final third, the defending team gets the ball.", "Defenders can all be in their own final third. Stay close together and win it.", "Teams can pass the ball back to the players behind the line to reset.", "If the defending team wins the ball, they attack the other way with the same rule.", "Kick in from the sideline to restart."], "scoring": "One point per goal. First team to 4.", "coach": [{"cue": "Defenders: stay close together. Shrink the space.", "ask": "How close were you to your teammates when you won it?"}, {"cue": "Attackers: nothing there? Pass it back and reset.", "ask": "What did you see that told you to pass back?"}, {"cue": "Win it, then go. Attack the other way right away.", "ask": "What did you do the moment you won the ball?"}], "type": "opening-play", "objective": "Defend with the numbers advantage and win the ball. Attackers can only send two players into the final third, so the defense is always outnumbered in your favor.", "progression": [{"title": "Easier", "text": "Let attackers send three players forward after the ball has been passed back once."}, {"title": "Harder", "text": "Only one attacker can enter the final third at U12 and U14, with a shorter field."}]}, {"id": "3v3-pressure-and-cover", "order": 111, "name": "3v3 Pressure and Cover", "block": "B3", "skills": ["Pressing", "Covering", "Communication"], "ages": ["u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Show the first defender and the cover once with a slow walk-through, then let them play."], "rules": ["The challenge: one defender goes to the ball and a teammate covers behind.", "When the other team has the ball, one defender pressures. The others stand behind and to the side, close enough to step in if the first defender is beaten.", "If a team wins the ball while a teammate is covering behind, they get a bonus point.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. Winning the ball with a teammate covering is 1 point. First team to 5.", "coach": [{"cue": "Pressure the ball quickly, then slow down as you get close.", "ask": "How did you close down the space?"}, {"cue": "Cover player: stand behind and to the side of your teammate.", "ask": "Where was your cover when the first defender got beaten?"}, {"cue": "Talk. Say \"I have it\" or \"cover.\"", "ask": "What did you call out when the first defender went to the ball?"}], "type": "opening-play", "objective": "One defender pressures the ball and the other two cover behind. Winning the ball with cover behind you is worth double.", "progression": [{"title": "Easier", "text": "Do not count the cover. Any steal is a bonus."}, {"title": "Harder", "text": "Both teammates must be covering for the steal to count at U12 and U14."}]}, {"id": "4v4-dont-dive-in", "order": 112, "name": "4v4 Do Not Dive In", "block": "B3", "skills": ["Delaying", "Pressing", "Decision-Making"], "ages": ["u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "4v4. Extra players wait on the sideline and rotate in after each goal.", "Show the attacker, the first defender and the show-to-one-side once, then let them play."], "rules": ["The challenge: slow the attacker down. Do not dive in.", "If a defender dives in and the attacker beats them with a dribble, the attacking team gets a bonus point.", "Defenders can win the ball when the attacker makes a mistake, a heavy touch or a bad pass.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. A beaten dive-in is 1 point for the attackers. First team to 5.", "coach": [{"cue": "Get close, then stop. Stay on your feet.", "ask": "What did you do when the attacker came at you?"}, {"cue": "Show the attacker to one side.", "ask": "Which way did you want them to go, and why?"}, {"cue": "Wait for the heavy touch.", "ask": "What did you see that told you to step in?"}], "type": "opening-play", "objective": "Slow the attacker down instead of diving in. If you dive in and get beaten, the attacker earns a point for the team.", "progression": [{"title": "Easier", "text": "Only count the dive-in point when the attacker beats the defender and is facing goal."}, {"title": "Harder", "text": "Defenders get a bonus when they force the attacker out wide."}]}, {"id": "3v3-pick-up-your-player", "order": 113, "name": "3v3 Pick Up Your Player", "block": "B3", "skills": ["Marking", "Communication", "Compact Shape"], "ages": ["u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Number the pinnies 1, 2 and 3. Each player marks the opponent with the same number.", "Hand out pinnies by number so every player can see their opponent's number."], "rules": ["The challenge: stay close to your player and between them and the goal.", "When the ball is lost, find your number straight away.", "A goal scored by a player whose marker is more than three steps away does not count for the attackers, and the defense gets a point.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. A goal against an unmarked player is 1 point for the defenders. First team to 5.", "coach": [{"cue": "Find your player. Stay between them and the goal.", "ask": "Where were you when your player had the ball?"}, {"cue": "Stay close enough to touch them, far enough to see the ball.", "ask": "How close were you, and could you see the ball?"}, {"cue": "Talk to a teammate who has lost their player.", "ask": "What did you say?"}], "type": "opening-play", "objective": "Stay close to your player. A goal scored by someone who was left open does not count for the other team.", "progression": [{"title": "Easier", "text": "Players can switch markers once, by calling it."}, {"title": "Harder", "text": "Marks change every two minutes, so players have to find a new opponent."}]}, {"id": "3v3-win-it-back-in-five", "order": 114, "name": "3v3 Win It Back in Five", "block": "B4", "skills": ["Pressing", "Decision-Making", "Communication"], "ages": ["u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "3v3. Extra players wait on the sideline and rotate in after each goal.", "Tell the team to start counting the moment the ball changes hands."], "rules": ["The challenge: lose it and win it right back.", "When a team loses the ball, they get five seconds to win it back. The coach or a sideline player counts out loud.", "Winning it back in five seconds earns a bonus point. After five, the game goes on with no bonus.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. Winning it back in five seconds is 1 point. First team to 5.", "coach": [{"cue": "Stop, then go. React the second you lose it.", "ask": "What was your first thought when you lost the ball?"}, {"cue": "The closest player goes to the ball. Everyone else closes the passing options.", "ask": "Who went to the ball, and who cut off the pass?"}, {"cue": "Winning it back is the start of the next attack.", "ask": "What did you do when you won it back?"}], "type": "opening-play", "objective": "React the moment you lose it. Win it back in five seconds and the team earns a point.", "progression": [{"title": "Easier", "text": "Give the team seven seconds."}, {"title": "Harder", "text": "Three seconds, or no bonus unless the whole team moved."}]}, {"id": "4v4-win-it-and-go", "order": 115, "name": "4v4 Win It and Go", "block": "B4", "skills": ["Decision-Making", "Pressing", "Combination Play"], "ages": ["u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 25 by 20 yards at U8, 30 by 25 at U10, and 35 by 30 at U12 and U14. Go smaller if it plays loose.", "Mini goals or cone goals at each end. No goalkeepers.", "4v4. Extra players wait on the sideline and rotate in after each goal.", "Tell players to start the count the moment they win the ball."], "rules": ["The challenge: when you win the ball, go forward right away.", "A goal scored within eight seconds of winning the ball counts double. The coach or sideline counts out loud.", "If the defending team has time to get back, go ahead and pass or build up. There is no penalty for taking more time.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. A goal within eight seconds of winning the ball is 2. First team to 5.", "coach": [{"cue": "Win it, look up and go.", "ask": "What did you see the moment you won it?"}, {"cue": "Pass forward early, to the open player.", "ask": "Who was open, and how fast did you play it?"}, {"cue": "Lost it? Get back and win it again.", "ask": "What did you do when you lost the ball?"}], "type": "opening-play", "objective": "Attack the moment you win it. Shoot within eight seconds of winning the ball and the goal counts double.", "progression": [{"title": "Easier", "text": "Give ten seconds."}, {"title": "Harder", "text": "Six seconds, and a counter has to use at least one pass."}]}, {"id": "5v5-first-time-finish", "order": 116, "name": "5v5 First-Time Finish", "block": "B5", "skills": ["Shooting", "Decision-Making", "Combination Play"], "ages": ["u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 12, "pairs_with": [], "equipment": "Balls · Cones · Mini goals or cone goals · Pinnies in 2 colors", "setup": ["Keep it small. Mark a field about 40 by 30 yards. Go smaller if it plays loose.", "A large goal or cone goal at each end. Add a goalkeeper if you have one willing.", "5v5. Extra players wait on the sideline and rotate in after each goal.", "Make the goals as big as you can, so players take shots."], "rules": ["The challenge: a first-time shot at goal counts double.", "A first-time shot means the player does not take a touch before shooting.", "Players can still take a touch and shoot. It only counts as 1.", "Kick in from the sideline to restart."], "scoring": "A goal is 1 point. A first-time goal is 2. First team to 6.", "coach": [{"cue": "Get your body ready before the ball arrives.", "ask": "What did you do before the pass reached you?"}, {"cue": "Move into the space where the cutback or the pass will arrive.", "ask": "Where did you run, and why there?"}, {"cue": "Missed? Reset right away.", "ask": "What did you do right after the miss?"}], "type": "opening-play", "objective": "Take the chance when it comes. A goal from a first-time shot counts double.", "progression": [{"title": "Easier", "text": "A touch and a shot with the same foot counts as a first-time shot."}, {"title": "Harder", "text": "Only count the bonus if the shot is on target."}]}], "teams": [{"id": "u14-comp", "age": "u14", "track": "comp", "label": "U13 and U14", "plan": {"season_note": "The weekly themes are a suggested order, so the season builds skill step by step instead of chasing whatever last weekend showed. Use them as the frame. If a game exposes a real problem, work it into your practice and keep the theme.", "id": "u14-comp", "age": "u14", "track": "comp", "sessions_per_week": 2, "phases": [{"name": "Preseason", "weeks": [1, 6], "goal": "Set the baseline", "text": "No Application-level work yet. Players install the habits and technique every later block depends on: individual technique, combination play and collective defending shape.", "success": "Players are comfortable receiving under light pressure, understand basic team mechanics and defensive shape, and show early decision-making instead of hesitation."}, {"name": "In-Season", "weeks": [7, 12], "goal": "Apply under real pressure", "text": "Games provide the pressure Application needs. B4 and B5 come online, and B1 to B3 start Application reps against real defenders.", "success": "Decisions hold up at game speed, transitions trigger without prompting, and finishing chances start to convert more consistently."}, {"name": "Peak Performance", "weeks": [13, 18], "goal": "Perform at the highest level", "text": "Every block cycles at Application through repeated performance, not new content. Composure and game management are built through reps, not lectures.", "success": "Composure in finishing moments, informed choices late in games, and communication and ownership without prompting."}], "standing": [{"title": "Every week: one live set-piece rep", "text": "Attacking or defending: a corner, a free kick or a throw-in. It is a background layer, not a themed week."}], "weeks": [{"week": 1, "focus": "First Touch & Awareness", "block": "B1", "level": "intro", "sessions": [{"block": "B1", "level": "intro"}, {"block": "B2", "level": "intro"}]}, {"week": 2, "focus": "Defending Starts With Shape", "block": "B3", "level": "intro", "sessions": [{"block": "B3", "level": "intro"}, {"block": "B1", "level": "intro"}]}, {"week": 3, "focus": "Supporting the Ball Carrier", "block": "B2", "level": "intro", "sessions": [{"block": "B2", "level": "intro"}, {"block": "B3", "level": "intro"}]}, {"week": 4, "focus": "Receiving Under Pressure", "block": "B1", "level": "dev", "sessions": [{"block": "B1", "level": "dev"}, {"block": "B2", "level": "dev"}]}, {"week": 5, "focus": "Compactness & Cover", "block": "B3", "level": "dev", "sessions": [{"block": "B3", "level": "dev"}, {"block": "B1", "level": "dev"}]}, {"week": 6, "focus": "Combination Play", "block": "B2", "level": "dev", "sessions": [{"block": "B2", "level": "dev"}, {"block": "B3", "level": "dev"}]}, {"week": 7, "focus": "Reading the Transition Moment", "block": "B4", "level": "intro", "sessions": [{"block": "B4", "level": "intro"}, {"block": "B1", "level": "app"}]}, {"week": 8, "focus": "Speed of Play", "block": "B4", "level": "dev", "sessions": [{"block": "B4", "level": "dev"}, {"block": "B2", "level": "app"}]}, {"week": 9, "focus": "First Touches in the Box", "block": "B5", "level": "intro", "sessions": [{"block": "B5", "level": "intro"}, {"block": "B3", "level": "app"}]}, {"week": 10, "focus": "Decision-Making Under Pressure", "block": "B4", "level": "app", "sessions": [{"block": "B4", "level": "app"}, {"block": "B1", "level": "app"}]}, {"week": 11, "focus": "Finishing the Attack", "block": "B5", "level": "dev", "sessions": [{"block": "B5", "level": "dev"}, {"block": "B2", "level": "app"}]}, {"week": 12, "focus": "Pressing Triggers", "block": "B4", "level": "app", "sessions": [{"block": "B4", "level": "app"}, {"block": "B3", "level": "app"}]}, {"week": 13, "focus": "Composure in the Box", "block": "B5", "level": "app", "sessions": [{"block": "B5", "level": "app"}, {"block": "B1", "level": "app"}]}, {"week": 14, "focus": "Tempo Control", "block": "B4", "level": "app", "sessions": [{"block": "B4", "level": "app"}, {"block": "B2", "level": "app"}]}, {"week": 15, "focus": "Winning Moments", "block": "B5", "level": "app", "sessions": [{"block": "B5", "level": "app"}, {"block": "B3", "level": "app"}]}, {"week": 16, "focus": "Composure at Speed", "block": "B1", "level": "app", "sessions": [{"block": "B1", "level": "app"}, {"block": "B4", "level": "app"}]}, {"week": 17, "focus": "Game Management", "block": "B2", "level": "app", "sessions": [{"block": "B2", "level": "app"}, {"block": "B5", "level": "app"}]}, {"week": 18, "focus": "Player Ownership", "coach_choice": true, "note": "Flex week. Players drive their own priorities heading into the break. Ask them what they want to work on, then build practice around it."}], "why_periodize": [{"title": "Plan, do not react", "text": "Periodization ties every week to a developmental standard: what players need to be building at this point in their growth, in the order that lets those habits compound. It is a plan built against a framework, and it holds regardless of how last Saturday went."}, {"title": "The alternative treats symptoms", "text": "After a tough loss it is tempting to chase the scoreline. Conceded on transitions, so Tuesday becomes a transition drill. Missed chances, so Wednesday is finishing. It feels responsive, but it treats symptoms instead of building players, and nothing compounds. A periodized plan stays with the standard. Trust the sequence, and problems like transitions and finishing tend to solve themselves, because the foundation underneath them is solid."}, {"title": "The season is a spiral", "text": "Blocks do not run once and finish. A concept is introduced, the team moves to other work, then returns to it at a deeper level, with real spacing so each return is a genuine retention check. Introduction becomes Development. Development becomes Application. At U13, Application is also where specialization begins, grouped by who executes the action together rather than assigned upfront."}, {"title": "Weekly themes are a lens", "text": "Every week carries a theme, something a player can hold onto: a focus idea you can build a practice around or talk about before or after training. The themes are not a second curriculum. They are a lens on the same week's work, connecting the technical content to something bigger like tempo, composure, decision-making and ownership."}, {"title": "Why this protects your players", "text": "A coach who reacts to every result sends a message: what we work on depends on whether we won last week. Players feel that instability and start playing not to make mistakes. A periodized plan says we know where we are going and this week connects to last week's and next week's. Players build confidence in the process, not just their skills."}, {"title": "What it asks of you", "text": "Hold the line when the instinct to fix things is strong. After a hard game you will want to throw the plan out. Sometimes that is the right call. But the default should be the plan, because it was built when you were thinking clearly, not in the 24 hours after a loss."}], "levels": [{"title": "Introduction", "text": "Players are becoming aware of a concept and trying it. Decisions are slow and execution is inconsistent. Every player at every position works through this level the same way."}, {"title": "Development", "text": "Players make repeatable, intentional choices. They understand the concept and are beginning to apply it under pressure, but it is not yet automatic. Still universal, with no position differentiation."}, {"title": "Application", "text": "Decisions are fast and reliable under real game pressure. This is where position-specific depth begins to show up, grouped by who actually executes the action together, not by fixed labels."}, {"title": "Your goal", "text": "Not to push every player to Application by the end of the season. Recognize where each player is and create the right conditions for them to move forward from there. Arriving at Introduction and leaving at Development is progress. Reaching Application under pressure by the final weeks is a great season."}, {"title": "Specialization at U13", "text": "Introduction and Development stay universal in every block. Application is where specialization begins, grouped by function rather than assigned upfront. A player's technique and decision-making at Application are still revealing what kind of player he is becoming. Locking a player into a position too early risks missing who he actually turns out to be."}]}, "goals": [{"id": "keeps-ball-full-field", "text": "Keeps the ball under pressure on the full field", "blocks": ["B1"]}, {"id": "defends-as-eleven", "text": "Defends as part of an eleven-player team", "blocks": ["B3"]}, {"id": "first-second", "text": "Reacts in the first second after the ball changes hands", "blocks": ["B4"]}, {"id": "shoots-with-composure", "text": "Takes shots with composure and makes good final-third decisions", "blocks": ["B5"]}, {"id": "times-runs", "text": "Times runs to arrive when the ball does", "blocks": ["B2", "B5"]}, {"id": "communicates", "text": "Communicates with and coaches teammates on the field", "blocks": ["B2", "B3"]}, {"id": "wants-to-play", "text": "Shows up wanting to play again", "blocks": ["B1", "B2", "B3", "B4", "B5"]}], "players": {"id": "u14-comp", "age": "u14", "who": [{"label": "Social", "text": "These players are moving into a new social world, the kind of shift that comes with heading toward high school. They are building an identity, which can create friction with authority, including you. They lean on a peer group or a best friend. Pushing back is part of how they grow up, not a sign they stopped caring. Treat it as defiance and you lose them. Give them some ownership of decisions and you keep them."}, {"label": "Emotional", "text": "Players are sensitive about their bodies and compare themselves to teammates who are maturing faster or slower. Mood swings are sharper than at U12 and impulse control is still catching up. The blowup after a bad touch or a tough loss is not an attitude problem. It is a player who has not built the regulation skills to match the emotion. Mistakes and losses carry more weight socially than they did at U12."}, {"label": "Cognitive", "text": "This is the inflection point. These players can reason beyond what they are told, take responsibility for their own commitment and plan ahead. They can start to build an identity around a role: not just a soccer player, but the center back or the wing back. That is what makes deeper positional work possible at U13. They can now understand why a responsibility exists and start to own it."}, {"label": "Physical", "text": "Growth is visible and uneven. Injury rates rise: ankle sprains, tendonitis, and growth-related issues like Osgood-Schlatter and Sever's. The gap between your earliest and latest maturing players is wider than last year and keeps widening through U14. Do not let physical maturity stand in for development. Flex effort and fitness expectations to the player, and watch training load."}, {"label": "What US Soccer asks", "text": "Progression Phase I is the first stage where players play inside a formation with defined roles. New objectives appear: midfield interchange, center back penetration into midfield to create overloads, and quick combination play under high pressure in tight spaces. Coaches are asked to help players own their development, encourage player-led warm-ups and player-to-player coaching, and have players solve game situations themselves."}], "great_session": [{"title": "Players take the shot", "text": "The ball is in the final third and someone shoots, early, with composure, without a second dribble. Missing is fine. Not shooting is the problem."}, {"title": "Compact, connected shape", "text": "Eleven players on a big field can look scattered. Look for lines that stay close enough to support each other: defenders, midfielders and forwards moving as one unit."}, {"title": "Instant reaction on turnovers", "text": "When the ball changes hands, do players react in the first second or watch? That reaction is the whole game-moments block."}, {"title": "Players talking to each other", "text": "Voices on the field: \"Man on,\" \"Turn,\" \"Switch.\" Player-to-player coaching is a development goal. Step back when it happens."}, {"title": "A Day 1 concept on Day 2", "text": "If something from the first session of the week shows up in the second without you asking, the concept is taking hold."}, {"title": "Everyone gets a turn in goal", "text": "Rotate the goalkeeper. Finishing practice is also goalkeeper practice, so nobody should miss out on a turn."}], "prepared": "Before you arrive, read the week's theme and the block and level for each practice. Build each practice from the library or your own activities. With two practices a week, Day 1 introduces and Day 2 deepens. Both are correct. Try not to pair two new concepts in the same practice. If the group needs more time on a concept, stay with it instead of moving on.", "parents": {"intro": "Before the session starts, take 30 seconds to walk over. Something like:", "script": "This season we are working on finishing and on the moment the ball changes hands. The most helpful thing you can do is cheer the brave decisions: the player who shoots, the player who sprints back, the player who tries the pass that might not work.", "outro": "At U14 players hear everything. Positive sideline energy is genuinely useful. Criticism of a missed shot makes the next shot less likely."}, "cues": [{"when": "Player shoots early and misses", "say": "\"Good decision. Great shot to take. Take that one every time.\" Praise the decision before you talk about the technique."}, {"when": "Player passes up a clear shot", "say": "Ask, do not tell: \"What were you thinking when you had that space?\" Then listen. Often it is confidence, not judgment."}, {"when": "Team defends compactly", "say": "\"That shape right there, everyone close enough to support each other. That is exactly what we are building toward.\""}, {"when": "Player presses instantly after turnover", "say": "Name it in the moment: \"Did everyone see that? No hesitation. That is the whole idea.\""}, {"when": "Players coaching each other", "say": "Step further back. Let it run. Come back and ask: \"What did you tell your teammate there?\""}, {"when": "Players too self-critical", "say": "\"The best players in the world miss shots and lose the ball in every game. The difference is what they do next.\""}]}, "framework": {"age": "u14", "blocks": {"B1": {"tagline": "Prepare the body. Read the picture. Execute with intent.", "overview": "Every player’s relationship with the ball comes before everything else. B1 establishes the perceptual and technical habits that make all combination play, defending, and finishing possible: scanning before the ball arrives, shaping the body to play forward, and using first touch to create a decision rather than just react to pressure. This block runs through every phase of the season because the habits live here. When a player stalls in B3 or B4, look back at B1 first.", "problem": "Players must scan, position, and execute first-touch decisions under high pressure in tight spaces. At U13, the skill itself does not change position to position, the environment around it does. First touch is now a decision made under maximum defensive intensity, not just a technical act.", "focus": ["Scanning before, during, and after receiving", "Body shape and movement to play forward", "Using first touch to create a decision, not just control", "Technique executed at full U13 game speed and pressure"]}, "B2": {"tagline": "Create advantage. Move the ball forward. Solve pressure together.", "overview": "Combination play only works if the individual technique from B1 is already in place. A player who cannot control the ball under light pressure cannot execute a wall pass at game speed. B2 takes that individual foundation and asks players to solve pressure together: recognizing a teammate's run, providing the right angle of support, and timing the next action so the advantage compounds rather than stalls.", "problem": "Players use teammates to create time, space, and numerical advantages, progressing the ball forward under pressure through deliberate combination play.", "focus": ["Supporting angle, distance, and timing", "Combination play to break defensive lines", "Recognizing and exploiting overloads", "Movement after the pass, not just the pass itself"]}, "B3": {"tagline": "Compact. Coordinated. Aggressive. Defending is not just for defenders.", "overview": "Defending is not just for defenders. Strikers set the tone for the entire pressing structure, they're often the first line and the players who trigger the whole team's coordinated press. B3 is where every player learns that winning the ball back is a collective action: the nearest player pressures, teammates cover behind, and the team stays connected and compact to protect dangerous space. At U13, the standard is no longer just reacting to losing the ball. Teams are expected to defend proactively, a compact, high defensive block that regains possession as high up the field as possible.", "problem": "Players create and maintain a compact, high defensive block, applying coordinated pressure-cover-balance to prevent forward play and regain the ball as high as possible.", "focus": ["Coordinated pressure-cover-balance", "Compact shape, vertically and horizontally", "High defensive line and line management", "Immediate reaction after losing the ball"]}, "B4": {"tagline": "Recognizing moments and acting fast.", "overview": "Transitions are the moments that decide games. B4 explicitly links attacking and defending: the instant possession changes, players must recognize the moment and respond, either with maximum intensity to win the ball back, or with immediate speed to attack before the opponent can organize. This block draws directly on B1, B2, and B3. A player who reacts fast in transition is applying all three at once, technique, combination, and defensive shape, compressed into a few seconds of chaos.", "problem": "Players recognize the moment possession changes and respond immediately, either pressing with maximum intensity to regain the ball or recovering into defensive shape, and on regain, either playing forward at speed or securing possession to build.", "focus": ["Immediate recognition of the transition moment", "Reaction speed and acceleration", "Press vs. recover, play forward vs. secure", "Communication and organization under chaos"]}, "B5": {"tagline": "Can we turn advantage into goals?", "overview": "All of the work in B1 through B4 is preparation for this block. Players who scan early, combine well, defend collectively, and transition fast create finishing opportunities. B5 is about having the composure and technique to take them. When players struggle to finish, the answer is rarely more finishing drills. Check the quality of preparation touches, the timing of runs, and the decisions made before the shot. The problem usually lives earlier in the chain.", "problem": "Players convert advantage into goals under high defensive pressure, separating to receive, combining for the final pass, and finishing with composure and limited touches, while managing tempo and stakes as the game state demands.", "focus": ["Converting advantage into goals through quality final actions", "Separating and unmarking to receive in the box", "Finishing with composure and limited touches under pressure", "Managing tempo and stakes as the game state demands"]}}}, "skills": [{"id": "u14-b1-perception-preparation-intro", "age": "u14", "block": "B1", "area": "Perception & Preparation", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Scan before receiving to identify pressure and options", "Begin orienting the body to see the field before the ball arrives", "Recognize the obvious difference between time and immediate pressure"]}, {"id": "u14-b1-controlling-intro", "age": "u14", "block": "B1", "area": "Controlling", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Treat first touch as a decision, not just control", "Receive across the body to begin opening up the field", "Use small, controlled touches to set up the next action"]}, {"id": "u14-b1-protecting-intro", "age": "u14", "block": "B1", "area": "Protecting", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Shield and protect the ball when no forward option exists", "Use the body between the ball and the defender", "Hold possession until a forward option opens"]}, {"id": "u14-b1-driving-intro", "age": "u14", "block": "B1", "area": "Driving", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Attack the ball under pressure, move toward it rather than waiting", "Push into open space when it is available", "Begin to play with the head up while moving with the ball"]}, {"id": "u14-b1-dribbling-intro", "age": "u14", "block": "B1", "area": "Dribbling", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Use a first action, touch or feint, to create space", "Begin recognizing obvious 1v1 moments", "Show basic coordination when changing direction with the ball"]}, {"id": "u14-b1-passing-intro", "age": "u14", "block": "B1", "area": "Passing", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Play forward when possible, support when not", "Use one touch when the pass dictates it", "Begin passing accurately with both feet under light pressure"]}, {"id": "u14-b1-decision-making-intro", "age": "u14", "block": "B1", "area": "Decision-Making", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Base the decision on body shape and scan before contact", "Recognize forced one-touch situations versus time to take a touch", "Decisions are deliberate and often reactive at this level"]}, {"id": "u14-b2-supporting-intro", "age": "u14", "block": "B2", "area": "Supporting", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Offer a clear passing option when a teammate has the ball", "Move to avoid standing directly behind a defender", "Reposition after passing rather than watching what happens next"]}, {"id": "u14-b2-technique-for-combination-play-intro", "age": "u14", "block": "B2", "area": "Technique for Combination Play", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Execute basic wall passes at reduced speed", "Use a simple supporting movement after passing", "Adjust passing technique to play to feet rather than space in combination situations"]}, {"id": "u14-b2-decision-making-intro", "age": "u14", "block": "B2", "area": "Decision-Making", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Recognize the basic choice between combining with a teammate and carrying forward individually", "Begin choosing between pass-and-move and carry based on where the defender is", "Make simple combination decisions without waiting to be told"]}, {"id": "u14-b3-perception-preparation-intro", "age": "u14", "block": "B3", "area": "Perception & Preparation", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["React to losing the ball with immediate urgency", "Identify the ball carrier as the first priority", "Recognize nearby teammates as defensive support"]}, {"id": "u14-b3-covering-intro", "age": "u14", "block": "B3", "area": "Covering", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Recognize the importance of helping a teammate who is pressing", "Begin to understand basic cover position behind the ball", "Stay connected to the nearest teammate rather than isolated"]}, {"id": "u14-b3-shape-line-management-intro", "age": "u14", "block": "B3", "area": "Shape & Line Management", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Understand that the team defends as a connected group, not individuals", "Begin to recognize when the team is too spread out", "Recover into a basic defensive shape after losing the ball"]}, {"id": "u14-b3-defensive-decision-making-intro", "age": "u14", "block": "B3", "area": "Defensive Decision-Making", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Understand the basic choice between pressing and delaying", "Begin to recover goal-side when beaten", "Recognize the importance of helping teammates defend rather than defending alone"]}, {"id": "u14-b4-perception-awareness-intro", "age": "u14", "block": "B4", "area": "Perception & Awareness", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Recognize the moment possession has changed", "Identify the immediate attacking or defensive cue that follows", "Begin scanning during chaotic, fast-moving moments"]}, {"id": "u14-b4-reaction-speed-intro", "age": "u14", "block": "B4", "area": "Reaction & Speed", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["React quickly after losing or winning the ball", "Accelerate toward the ball or space without hesitation", "Attempt a forward pass after regaining possession when available"]}, {"id": "u14-b4-decision-making-intro", "age": "u14", "block": "B4", "area": "Decision-Making", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Choose between fast attack and holding possession after a regain", "Recognize when the press has failed and the team must recover", "Support teammates in transition rather than acting alone"]}, {"id": "u14-b5-recognizing-the-moment-intro", "age": "u14", "block": "B5", "area": "Recognizing the Moment", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Identify when in shooting or final-pass range", "Notice goal location and basic pressure", "Recognize simple scoring opportunities"]}, {"id": "u14-b5-executing-final-actions-intro", "age": "u14", "block": "B5", "area": "Executing Final Actions", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Use inside foot or simple laces technique to finish", "Complete uncontested headers or rebounds", "Execute basic cutbacks or square passes"]}, {"id": "u14-b5-composure-ownership-intro", "age": "u14", "block": "B5", "area": "Composure & Ownership", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Willing to shoot or play the final pass", "Accept missed chances without frustration", "Reset quickly after attempts"]}, {"id": "u14-b1-perception-preparation-dev-comp", "age": "u14", "block": "B1", "area": "Perception & Preparation", "level": "dev", "tracks": ["comp"], "bullets": ["Scan twice before every reception: once for pressure, once for the next pass or run", "Body shape oriented to see the largest number of options before receiving, not just the nearest one", "Recognize the difference between time to take a touch and a forced one-touch situation before the ball gets there"]}, {"id": "u14-b1-perception-preparation-app-comp", "age": "u14", "block": "B1", "area": "Perception & Preparation", "level": "app", "tracks": ["comp"], "bullets": ["Scan and prepare while a defender is actively closing, not against a static picture", "Recognize disguised pressure, a defender showing late or from a blind angle, and adjust body shape in the moment it appears"]}, {"id": "u14-b1-controlling-dev-comp", "age": "u14", "block": "B1", "area": "Controlling", "level": "dev", "tracks": ["comp"], "bullets": ["First touch redirects the ball into space, not just to the foot", "Receive across the body to open up the field in one motion", "Control under direct physical pressure without losing the ball under the body"]}, {"id": "u14-b1-controlling-app-comp", "age": "u14", "block": "B1", "area": "Controlling", "level": "app", "tracks": ["comp"], "bullets": ["Make the first-touch decision in real time against a defender who is committed and moving at speed, not jogging into a passive challenge", "Recover from a heavy or imperfect touch without panicking or losing the ball"]}, {"id": "u14-b1-protecting
