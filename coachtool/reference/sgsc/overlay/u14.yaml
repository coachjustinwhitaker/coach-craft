format: 11v11
rules:
- label: Format
  text: 11v11 on a full-size field, roughly 100 to 120 yards long and 50 to 80 yards wide. Size 5 ball.
    Goals are 8 feet by 24 feet.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Heading
  text: Deliberate heading is allowed in games at 11v11. Build up to it gradually in training and keep
    the number of headers low.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Offside
  text: Offside applies. Teach it early. Club linesmen cannot call offside, so with one referee the referee
    makes that call.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Build-out line
  text: None at 11v11. The build-out line used at 7v7 and 9v9 goes away. Goalkeepers and defenders now
    play out of the back under real pressure.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Substitutions
  text: Unlimited, at any stoppage with the referee's permission. Substitutes wait at the halfway line
    until the referee waves them on.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Rosters
  text: Up to 18 on a game-day roster. A team needs at least 7 players to play.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Free kicks and penalties
  text: Opponents stand 10 yards back on free kicks. Penalty kicks are taken from 12 yards.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Officials
  text: Three referees where possible. One referee with two club linesmen is allowed when licensed officials
    are short.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
- label: Head injuries
  text: A player removed for a suspected head injury cannot return that day and needs clearance from a
    licensed healthcare provider before playing again.
  source: NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13
pathway:
- Some players will show real passion and ability this season
- Sierra Gold's competitive program exists to open more doors for those players when they are ready
- Talk to your club director about what that pathway looks like
contact: Got a question about an activity? Want to talk through what you are seeing at training? Not sure
  how to introduce finishing to your group? Your Age Group Coordinator and the club Technical Director
  are there for exactly this. Reach out any time.
