*{box-sizing:border-box}button,select,input{font-family:inherit}body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}

.slot{border-top:1px solid var(--line);padding:12px 0}.slot:first-child{border-top:0}.slot .lab{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}

.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.alt span{font-size:15px}

.tag{text-decoration:none}
.back{display:inline-block;margin:4px 0 8px;color:var(--navy);text-decoration:none;font-weight:600}
nav.tabs{display:flex;gap:6px;margin:6px 0 12px}nav.tabs a{flex:1;text-align:center;padding:8px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--navy);text-decoration:none;font-size:14px;font-weight:600}nav.tabs a.on{background:var(--navy);color:#fff}
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}.strip a{color:var(--navy);text-decoration:none;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.strip a.off{opacity:.3;pointer-events:none}.strip span{font-size:13px;color:var(--mute);text-align:center}
.dots{display:flex;gap:5px;margin:4px 0 10px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--gold)}
.skip{display:block;text-align:center;color:var(--mute);font-size:14px;margin-top:14px}.banner{background:#F2F7FC;border:1px solid #BDDDFC;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}.tile{background:#fff;border:1px solid #e3e8f1;border-radius:14px;padding:10px 12px;position:relative}.tile span{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}.tile b{font-size:15px;line-height:1.25;color:var(--navy)}.tile .club{position:absolute;top:10px;right:10px}
.rule .src{font-size:12px;color:var(--mute)}.rule .club{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase}

.share{display:flex;gap:8px;margin:14px 0}.share button{margin:0;flex:1}
nav.tabs{gap:0!important;margin:0 0 12px!important;border-bottom:1px solid var(--line)}nav.tabs a{flex:1;background:none!important;border:0!important;border-bottom:3px solid transparent!important;border-radius:0!important;padding:10px 4px!important;font-size:15px!important;color:var(--mute)!important}nav.tabs a.on{color:var(--navy)!important;border-bottom-color:var(--gold)!important}
.card>p:first-child{margin-top:0}.card>p:last-child{margin-bottom:0}.card.game{background:#f0f3f9;border-style:dashed}
.swap summary{font-size:14px;color:var(--mute);font-weight:500}.bar{height:4px;border-radius:2px;background:var(--line);margin:4px 0 8px}.bar i{display:block;height:100%;border-radius:2px;background:var(--gold)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;text-align:left;box-sizing:border-box;width:100%;padding:10px;font:inherit;font-size:16px;border:1px solid #c9d0db;border-radius:8px;background:#fff;min-height:46px}
.reset a{color:var(--mute)}.note a{color:var(--navy)}select:invalid{color:var(--mute)}
.reset{color:var(--mute);font-size:13px;text-align:center;margin:24px 0}

</style><script src="../../assets/gate-config.js"></script><script src="../../assets/gate.js" defer></script></head><body class="cc-col">

<main id="app"></main>
<footer id="foot" class="noprint"></footer>
<script>
const DATA = /*DATA*/;
const KEY = 'coachplanner.v1' + (DATA.area === 'comp' ? '.comp' : '');
const SPACE = {quarter: 1, half: 2, full: 3};
const SPACE_LABEL = {quarter: '1/4 field', half: '1/2 field', full: 'Full field'};
let state = load();
if(state.space && !SPACE[state.space]) state.space = 'half';
let route = '';
try { route = location.hash.slice(1); } catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = s => document.querySelector(s), app = $('#app');
const acts = Object.fromEntries(DATA.activities.map(a => [a.id, a]));
if(state.players && !state.team) state.team = 'u10-rec';
const teamOf = id => DATA.teams.find(t => t.id === id) || DATA.teams[0];
let T = teamOf(state.team), plan = T.plan;
function setTeam(id){ T = teamOf(id); plan = T.plan; state.team = T.id; }
const A = id => { const a = acts[id], o = (a.for_age || {})[T.age]; return o ? Object.assign({}, a, o) : a; };
function actName(ref){ const [b, v] = ref.split('#'); const a = acts[b]; if(!v) return a.name; return (a.variants||[]).find(x => x.id === v).name; }
const LVL = {intro: 'Introduction', dev: 'Development', app: 'Application'}, LVS = {intro: 'Intro', dev: 'Dev', app: 'App'};
const sesBlock = (w, si) => w.sessions[si].block || w.block, sesLevel = (w, si) => w.sessions[si].level;
const slotsOf = (w, si) => ['a','b'].filter(k => w.sessions[si][k]);
function slotRef(w, si, slot){ const k = `${w.week}-${si}-${slot}`; return (state.swaps||{})[k] || w.sessions[si][slot].activity; }
function fits(a){ return (!state.players || (a.players.min <= state.players && state.players <= a.players.max)) && (!state.space || SPACE[a.space] <= SPACE[state.space]); }
function alternatives(w, si, slot){
  const slots = slotsOf(w, si), ref = slotRef(w, si, slot), cur = ref ? ref.split('#')[0] : '', others = slots.filter(k => k !== slot).map(k => { const r = slotRef(w, si, k); return r ? r.split('#')[0] : ''; });
  const ok = T.ladder, blk = sesBlock(w, si), lvl = sesLevel(w, si), same = [blk].concat(w.also_blocks || []), anchor = slots.length > 1 && slot === 'a';
  const curT = cur ? (A(cur) || {}).type : '';
  const list = DATA.activities.filter(a => a.ages.includes(T.age) && a.tracks.includes(T.track) && a.id !== cur && !others.includes(a.id) && fits(a) && (!lvl || (a.levels || []).includes(lvl)) && (anchor ? (ok.indexOf(a.block) <= ok.indexOf(blk) || same.includes(a.block)) : same.includes(a.block)));
  return list.sort((x, y) => (y.type === curT) - (x.type === curT));
}
const DAY = 864e5, iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }, parse = t => { const [y,m,d] = t.split('-').map(Number); return new Date(y, m-1, d); };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const nice = t => parse(t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
function curWeek(){ const N = plan.weeks.length; if(!state.start) return Math.min(state.week || 1, N); return Math.max(1, Math.min(N, Math.floor((todayD() - parse(state.start)) / (7*DAY)) + 1)); }

let whyFrom = '';
const TYPE = id => ((DATA.types || []).find(t => t.id === id) || {}).label || '';
function go(h){ if(h.startsWith('why/')) whyFrom = route || ''; route = h; try { history.replaceState(null, '', '#' + h); } catch(e){} render(); }
document.addEventListener('click', e => { const im = e.target.closest('.dg'); if(im){ im.classList.toggle('big'); return; } const a = e.target.closest('[data-nav]'); if(a){ e.preventDefault(); go(a.dataset.nav); } });
function rulesHtml(){
  const loc = r => r.origin === 'club' ? '<span class="club">Local</span>' : '';
  const short = T.rules.filter(r => r.text.length <= 40), long = T.rules.filter(r => r.text.length > 40);
  return (short.length ? `<div class="tiles">${short.map(r => `<div class="tile"><span>${r.label}</span><b>${r.text}</b>${loc(r)}</div>`).join('')}</div>` : '') + (long.length ? `<div class="card">${long.map(r => `<p class="rule"><b>${r.label}</b> ${loc(r)}<br>${r.text}</p>`).join('')}</div>` : '');
}

function viewWelcome(){
  const comp = DATA.area === 'comp';
  app.innerHTML = comp ? `<h1 style="margin-top:18px">Welcome to the Coach Companion</h1><p class="lead">A season frame and a library of activities. You plan the practices.</p>
  <div class="card"><p><b>A frame for the season</b><br>Each week has a theme, a block and a level. It builds skill across the whole season, so you are not chasing last weekend's game.</p><p><b>Your practices</b><br>Pick from the library or add your own activities. Set the minutes and the order.</p><p><b>One shared language</b><br>The same blocks and words from U6 to U14, so coaches and players talk about the game the same way.</p></div>
  <p class="note">Setup takes a few minutes the first time. Your plans stay on this device. The club does not see them.</p><button id="gs">Get started</button>`
  : `<h1 style="margin-top:18px">Welcome to the Coach Companion</h1><p class="lead">Ideas for every week of your season, and a how-to for every activity. Use what helps. Change what does not.</p>
  <div class="card"><p><b>A suggested practice for each week</b><br>Run it as written, or make it yours.</p><p><b>Swaps when something does not fit</b><br>Change any activity to suit your numbers and your space.</p><p><b>One shared language</b><br>The same ideas and words from U6 to U14, so coaches and players talk about the game the same way.</p></div>
  <p class="note">Setup takes a few minutes the first time. After that it opens on this week.</p><button id="gs">Get started</button>`;
  $('#gs').onclick = () => go('setup');
}
function viewSetup(){
  const first = !state.players;
  app.innerHTML = (first ? '' : needTour() ? '<a class="back" href="#" data-nav="onb/1">&larr; Back to the tour</a>' : '<a class="back" href="#" data-nav="more">&larr; More</a>') + `<h1>Set up your team</h1><p class="lead">${first ? 'A few quick questions, then a short tour of your age group.' : 'Change any of this at any time.'}</p>
  <div class="card"><label>Age group</label><select id="ag" required>${first ? '<option value="" disabled selected>Choose your age group</option>' : ''}${DATA.teams.map(t => `<option value="${t.id}" ${!first && T.id===t.id?'selected':''}>${t.label}</option>`).join('')}</select>
  <label>Players at a typical practice</label><input id="pl" type="number" min="4" max="24" value="${state.players||12}">
  <label>Space you usually have for a session</label><select id="sp">${Object.keys(SPACE_LABEL).map(k => `<option value="${k}" ${(state.space||'half')===k?'selected':''}>${SPACE_LABEL[k]}</option>`).join('')}</select>
  <label>First week of your season</label><input id="st" type="date" value="${state.start || iso(todayD())}"><p class="note" style="margin:6px 0 0">The app opens on the week you are in. Not sure yet? Leave it as today.</p><p class="note" style="margin:10px 0 0">Everything you set up and change stays on this device. The club does not see it.</p>

  $('#ok').onclick = () => { if(!$('#ag').value){ $('#ag').focus(); return; } if($('#ag').value !== T.id){ state.swaps = {}; setTeam($('#ag').value); } state.players = +$('#pl').value; state.space = $('#sp').value; state.start = $('#st').value || iso(todayD()); save(); go(needTour() ? 'onb/1' : 'now'); };

  $('#rsy').onclick = () => { state = {}; save(); setTeam(DATA.teams[0].id); go('setup'); };

  app.innerHTML = `${whyFrom.startsWith('onb/') ? `<a class="back" href="#" data-nav="${whyFrom}">&larr; Back to the tour</a>` : '<a class="back" href="#" data-nav="guide/goals">&larr; Player goals</a>'}<div class="whyhd" style="--bc:${BCOL(b)}"><div class="why-eb">Why it matters</div><h1>${DATA.blocks[b].name}</h1></div><p class="tagline" style="--bc:${BCOL(b)}">${f.tagline}</p>
  <div class="idea${f.problem.length > 180 ? ' long' : ''}" style="--bc:${BCOL(b)}"><span>${comp ? 'The game problem' : 'The big idea'}</span>${f.problem}</div>
  <div class="card"><div class="lbl">About this block</div><p>${f.overview}</p></div>
  ${fold ? `<h2>Core focus and what to look for</h2>${looks}` : `<h2>Core focus</h2><div class="card focus" style="--bc:${BCOL(b)}">${ul(f.focus)}</div><h2>What to look for</h2>${looks}`}`;
}
function foot(h){
  const el = $('#foot'); if(!el) return; if(h.startsWith('onb/')){ el.innerHTML = ''; return; }
  const H = DATA.help || {}, C = DATA.credit || {};
  el.innerHTML = (H.email ? `<div><a href="mailto:${H.email}?subject=${encodeURIComponent('Coach help: ' + T.label + ' ' + T.track)}">Ask for help</a></div>` : '') + (C.author ? `<div>Designed by ${C.author}</div>` : '') + (DATA.updated ? `<div class="u">Updated ${DATA.updated}</div>` : '');
}
function render(){
  let h = route || (!state.players ? 'welcome' : needTour() ? 'onb/1' : 'now');
  if(!state.players && h !== 'setup' && h !== 'welcome'){ route = 'welcome'; return render(); }
  if(h === 'welcome') viewWelcome(); else if(h === 'setup') viewSetup(); else if(h === 'now') viewWeek(curWeek()); else if(h === 'goals') viewGuide('goals'); else if(h === 'guide') viewGuide(); else if(h.startsWith('guide/')) viewGuide(h.split('/')[1]); else if(h.startsWith('onb/')) viewTour(+h.split('/')[1]); else if(h === 'more') viewMore(); else if(h === 'library') viewLibrary(); else if(h === 'goals') viewGoals(); else if(h.startsWith('week/')) viewWeek(Math.max(1, Math.min(plan.weeks.length, +h.split('/')[1]))); else if(h.startsWith('why/')) viewWhy(h.split('/')[1]); else viewPlan();
  { const hs = document.querySelector('header small'); if(hs){ if(!hs.dataset.base) hs.dataset.base = hs.textContent; hs.textContent = state.players ? hs.dataset.base.replace(' · prototype', ' · ' + T.label + ' · prototype') : hs.dataset.base; } }
  foot(h); window.scrollTo(0,0);
}
render();
</script></body></html>
